<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cedi Ledger</title>
<meta name="description" content="Invoices, receipts, expenses and budgets in one place.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light only">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<script src="jspdf.umd.min.js"></script>
<script src="config.js"></script>
<script src="supabase.min.js"></script>
<style>
/* Layout: clean white ledger with pastel accents — left rail on desktop, bottom tab bar on phones; San Francisco throughout. */
:root{
  --bg:#ffffff; --surface:#ffffff; --sunken:#f6f5f4; --ink:#2c2a27; --muted:#76716b; --line:#ecebe9;
  --pink:#f4c4d0; --pink-soft:#fcecf0; --pink-deep:#b85870;
  --olive:#c5cf9f; --olive-soft:#f2f5e6; --olive-deep:#5f6c33;
  --lav:#d8cdef; --lav-soft:#f4f0fb; --peach:#f8d3b8; --mint:#c4e3d3; --butter:#f4e4a6; --butter-soft:#fcf7e2;
  --sky:#c7dcef; --clay:#e9b9aa; --sage:#bfccb4;
  --btn:#f4c4d0; --btn-ink:#2c2a27; --btn-hover:#efb2c2;
  --good:#5f6c33; --warn:#9a6b12; --bad:#b24a5c;
  --paper:#ffffff; --paper-ink:#2c2a27; --paper-muted:#7d776f; --paper-line:#ecebe9;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Helvetica,Arial,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.mono{font-variant-numeric:tabular-nums;letter-spacing:.01em}
svg text{font-family:var(--f-body);font-variant-numeric:tabular-nums}
input,select,textarea,button{font-family:var(--f-body)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.015em}
:focus-visible{outline:2px solid var(--pink-deep);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:24px 14px;background:var(--sunken);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--pink);display:grid;place-items:center;overflow:hidden;flex:none}
.brand-mark span{width:24px;height:24px;border-radius:50%;background:var(--olive);display:grid;place-items:center;font-weight:800;font-size:14px;color:#3d3830}
.brand-mark img{width:100%;height:100%;object-fit:contain;background:var(--surface)}
.brand b{font-family:var(--f-display);font-weight:700;font-size:19px;display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--sunken);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--pink-soft);color:var(--ink)}
.nav a[aria-current="page"] svg{color:var(--pink-deep)}
.nav svg{width:19px;height:19px;flex:none}
.nav .count{margin-left:auto;font-family:var(--f-body);font-size:12px;background:var(--butter);color:#3d3830;border-radius:8px;padding:0 7px}
.rail-foot{font-size:12px;color:var(--muted);padding:0 8px}

main{min-width:0;padding-block:26px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head h1{font-size:32px;line-height:1.1}
.head p{margin:4px 0 0;color:var(--muted)}
.head-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.head-actions input[type=month]{width:auto;min-width:0;max-width:190px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap;min-height:40px}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.primary:hover{background:var(--btn-hover)}
.btn.olive{background:var(--olive);color:#3d3830;border-color:var(--olive)}
.btn.danger{color:var(--bad);border-color:var(--pink-soft)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 11px;font-size:13px;min-height:34px}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:default}
a.btn{text-decoration:none;color:inherit}
a.btn.primary{color:var(--btn-ink)}
.field label.btn{text-transform:none;letter-spacing:0;font-size:13px;color:#2c2a27;font-weight:700}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:20px 22px;min-width:0}
.panel h2{font-size:19px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.panel-head .sub{color:var(--muted);font-size:13px}
a.sub{color:var(--pink-deep);font-weight:700;text-decoration:none}
.grid-2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
.grid-2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}

.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:13px 18px;border-radius:16px;background:var(--butter-soft);border:1px dashed var(--butter);font-size:14px}
.banner.lav{background:var(--lav-soft);border-color:var(--lav)}
.banner.pink{background:var(--pink-soft);border-color:var(--pink)}
.from-box{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;align-items:center;padding:14px;border-radius:16px;background:var(--sunken)}
.from-box .preview{width:88px;height:56px;border-radius:10px;background:var(--paper);border:1px solid var(--paper-line);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--muted);font-size:11px;text-align:center}
.from-box .preview img{width:100%;height:100%;object-fit:contain}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;border-radius:18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi.t1{background:var(--olive-soft)} .kpi.t2{background:var(--pink-soft)} .kpi.t3{background:var(--lav-soft)} .kpi.t4{background:var(--butter-soft)}
.kpi .label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
.kpi .val{font-family:var(--f-body);font-variant-numeric:tabular-nums;font-size:24px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .hint{font-size:13px;color:var(--muted)}
.up{color:var(--good)} .down{color:var(--bad)}

/* Donut */
.donut{display:grid;grid-template-columns:170px minmax(0,1fr);gap:20px;align-items:center}
.donut svg{width:100%;max-width:170px;height:auto;display:block}
.donut-legend{display:flex;flex-direction:column;gap:7px;font-size:14px;min-width:0}
.donut-legend div{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:9px;align-items:center}
.donut-legend i{width:12px;height:12px;border-radius:4px}
.donut-legend span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donut-legend .pct{color:var(--muted);font-family:var(--f-body);font-size:12px;min-width:34px;text-align:right}
.donut-legend .v{font-family:var(--f-body);font-size:13px;text-align:right}

/* Bars */
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;font-size:14px}
.bar-row .amt{font-family:var(--f-body);font-size:13px;color:var(--muted)}
.bar-row .amt b{color:var(--ink);font-weight:500}
.track{grid-column:1/-1;height:10px;background:var(--sunken);border-radius:8px;position:relative;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:8px;background:var(--olive)}
.fill.warn{background:var(--butter)} .fill.over{background:var(--pink-deep)}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px}

/* Lists & tables */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--muted)}
.ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--sunken);color:var(--muted)}
.ico.in{background:var(--olive-soft);color:var(--olive-deep)} .ico.out{background:var(--pink-soft);color:var(--pink-deep)}
.ico svg{width:17px;height:17px}
.table-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunken)}
td.r,th.r{text-align:right}
td .muted,.muted{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;color:#3d3830}
.pill.draft{background:var(--sunken);color:var(--muted)}
.pill.sent{background:var(--sky)}
.pill.paid{background:var(--olive)}
.pill.overdue{background:var(--pink)}
.tag{display:inline-block;padding:1px 9px;border-radius:8px;font-size:12px;white-space:nowrap;color:#3d3830;font-weight:600}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:4px;flex-wrap:wrap;background:var(--sunken);padding:4px;border-radius:14px}
.chip{border:0;background:transparent;padding:6px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=search],input[type=month],input[type=password],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;min-width:0;font-size:16px;min-height:42px}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--pink-soft);border-color:var(--pink-deep)}
.toolbar input[type=search]{max-width:240px}
.toolbar select,.toolbar input[type=month]{width:auto}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.items{display:flex;flex-direction:column;gap:8px}
.item-row{display:grid;grid-template-columns:minmax(0,1fr) 72px 120px 110px 40px;gap:8px;align-items:center}
.item-row .line-total{font-family:var(--f-body);text-align:right;font-size:14px}
.totals{display:grid;grid-template-columns:auto auto;justify-content:end;gap:4px 24px;font-size:14px;margin-top:6px}
.totals .num{text-align:right}
.totals .grand{font-weight:800;font-size:17px}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:700;font-size:18px;margin-bottom:4px}
.foot-total{display:flex;justify-content:space-between;padding-top:12px;font-weight:700;border-top:1px solid var(--line);margin-top:6px}

.logo-box{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px;border:1px dashed var(--line);border-radius:16px;background:var(--sunken)}
.logo-box .preview{width:120px;height:64px;border-radius:10px;background:var(--paper);display:flex;align-items:center;justify-content:center;overflow:hidden;color:var(--paper-muted);font-size:12px;border:1px solid var(--paper-line)}
.logo-box .preview img{width:100%;height:100%;object-fit:contain}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(40,32,30,.42);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:50;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:22px;width:100%;max-width:780px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal.narrow{max-width:520px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:21px}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.modal-foot .left{margin-right:auto}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--pink-soft);border-radius:12px;font-size:14px}

/* Paper document */
.paper{position:relative;background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:14px;padding:30px;font-size:14px;overflow:hidden}
.paper .band{position:absolute;inset:0 0 auto 0;height:8px;background:linear-gradient(90deg,var(--pink) 0 50%,var(--olive) 50% 100%)}
.paper .p-top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.paper .p-logo{max-width:150px;max-height:64px;object-fit:contain;display:block;margin-bottom:8px}
.paper h3{font-size:30px;letter-spacing:-.01em}
.paper .p-muted{color:var(--paper-muted)}
.paper .p-meta{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:13px;align-content:start}
.paper .p-meta span:nth-child(odd){color:var(--paper-muted)}
.paper table th{color:var(--paper-muted);border-color:var(--paper-line)}
.paper table td{border-color:var(--paper-line)}
.paper .p-sec{margin-top:22px}
.paper .p-amount{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.paper .stamp{position:absolute;right:28px;width:190px;pointer-events:none;opacity:.92}
.paper .stamp.inv{top:110px;width:160px}
.paper .stamp.rct{top:120px}
.paper .lbl{color:var(--paper-muted)}
.paper .table-x{overflow-x:auto}
.paper .pay-box{border:1px solid var(--paper-line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:#fcfbfa}
.paper .pay-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px 24px}
.paper .pay-title{font-weight:700;margin-bottom:4px}
.paper .pay-kv{grid-template-columns:auto minmax(0,1fr);gap:3px 14px}
.paper .pay-kv span:nth-child(even){overflow-wrap:anywhere}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

.tabbar{display:none}
@media (max-width:960px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-2,.grid-2e{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
  .head h1{font-size:27px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;padding:5px 0;border-radius:12px}
  .tabbar a[aria-current="page"]{color:var(--ink);background:var(--pink-soft)}
  .tabbar a[aria-current="page"] svg{color:var(--pink-deep)}
  .tabbar svg{width:21px;height:21px}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .item-row{grid-template-columns:minmax(0,1fr) 58px 92px 40px}
  .item-row .line-total{display:none}
  .paper{padding:22px 18px}
  .paper .stamp{width:130px;right:14px}
  .paper .stamp.inv{width:110px;top:96px}
  .kpi .val{font-size:19px}
  .toolbar input[type=search]{max-width:none;flex:1 1 100%}
  .donut{grid-template-columns:minmax(0,1fr);justify-items:center}
  .donut-legend{width:100%}
  .head-actions .hide-sm{display:none}
}
/* Sign-in, team and account */
.gate{min-height:100%;display:flex;align-items:flex-start;justify-content:center;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:linear-gradient(180deg,var(--pink-soft),var(--bg) 360px)}
.gate-card{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);padding:28px 24px;display:flex;flex-direction:column;gap:16px}
.gate-brand{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.gate-brand .brand-mark{width:56px;height:56px;border-radius:16px}
.gate-brand .brand-mark span{width:34px;height:34px;font-size:19px}
.gate h1{font-size:26px}
.gate p{margin:0;color:var(--muted)}
.gate form{display:flex;flex-direction:column;gap:12px}
.btn.block{width:100%}
.btn.google{gap:10px}
.btn.google svg{width:18px;height:18px}
.divider{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--line)}
.linkbtn{background:none;border:0;padding:0;color:var(--pink-deep);font-weight:700;cursor:pointer;font-size:14px;text-align:left}
.gate-links{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px}
.msg{padding:10px 12px;border-radius:12px;font-size:14px}
.msg.ok{background:var(--olive-soft)}
.msg.err{background:var(--pink-soft);color:var(--bad)}
.spinner{width:28px;height:28px;border-radius:50%;border:3px solid var(--pink-soft);border-top-color:var(--pink-deep);margin:18px auto}
@media (prefers-reduced-motion:no-preference){.spinner{animation:spin .8s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.code-input{font-size:24px!important;letter-spacing:.35em;text-align:center}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px}
.check input{width:20px;height:20px;margin-top:1px;accent-color:var(--pink-deep)}
.member{display:grid;grid-template-columns:38px minmax(0,1fr) auto;gap:12px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.member:first-child{border-top:0}
.member .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member .s{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.member-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.member-actions select{width:auto;min-height:34px;padding:4px 8px;font-size:13px}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;color:#2c2a27;font-size:15px}
.pill.role-owner{background:var(--pink)}
.pill.role-admin{background:var(--lav)}
.pill.role-member{background:var(--sunken);color:var(--muted)}
.invite-link{display:flex;flex-direction:column;gap:10px;padding:12px 14px;border-radius:14px;background:var(--olive-soft)}
.invite-link code{font-family:var(--f-body);font-size:13px;word-break:break-all;user-select:all}
.ws-list{display:flex;flex-direction:column;gap:8px}
.ws-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-radius:14px;border:1px solid var(--line)}
.ws-row.current{background:var(--pink-soft);border-color:var(--pink)}
.row-inline{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end}
.row-inline .field{flex:1 1 200px}
fieldset{border:0;padding:0;margin:0;min-width:0}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--olive-deep)}
.sync.off i{background:var(--warn)}
.byline{font-size:12px;color:var(--muted)}
/* Settings */
.settings{display:grid;grid-template-columns:210px minmax(0,1fr);gap:24px;align-items:start}
.set-nav{position:sticky;top:calc(16px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:2px;padding:8px;border:1px solid var(--line);border-radius:18px;background:var(--surface)}
.set-nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600;white-space:nowrap}
.set-nav a:hover{background:var(--sunken);color:var(--ink)}
.set-nav a[aria-current="page"]{background:var(--pink-soft);color:var(--ink)}
.set-nav a[aria-current="page"] svg{color:var(--pink-deep)}
.set-nav svg{width:18px;height:18px;flex:none}
.set-body{display:flex;flex-direction:column;gap:20px;min-width:0}
.set-body .panel p.lead{margin:0 0 14px;color:var(--muted)}
.profile-top{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.avatar.xl{width:88px;height:88px;font-size:30px}
.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%;display:block}
.avatar{overflow:hidden;flex:none}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;font-size:14px}
.kv span:nth-child(odd){color:var(--muted)}
.chips-row{display:flex;gap:6px;flex-wrap:wrap}
.danger-zone{border-color:var(--pink)}
.danger-zone h2{color:var(--bad)}
.me-chip{display:flex;align-items:center;gap:10px;padding:8px;border-radius:14px;text-decoration:none;color:var(--ink)}
.me-chip:hover{background:var(--surface)}
.me-chip .avatar{width:32px;height:32px;font-size:12px}
.me-chip b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px}
.me-chip small{display:block;font-size:11px;color:var(--muted)}
.rail-bottom{margin-top:auto;display:flex;flex-direction:column;gap:6px}
@media (max-width:760px){
  .settings{grid-template-columns:minmax(0,1fr);gap:14px}
  .set-nav{position:static;flex-direction:row;overflow-x:auto;padding:4px;border-radius:14px;scrollbar-width:none}
  .set-nav::-webkit-scrollbar{display:none}
  .set-nav a{padding:7px 12px;font-size:14px}
  .set-nav svg{display:none}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv span:nth-child(odd){margin-top:6px}
}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .5s ease}}

<body>
<div class="gate" id="gate" hidden></div>
<div class="app" id="app">
  <aside class="rail" aria-label="Main">
    <div class="brand"><div class="brand-mark" id="brandMark"><span>₵</span></div><div><b>Cedi Ledger</b><small id="bizName">Your business</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-bottom"><a class="me-chip" id="meChip" href="#settings-profile"></a><div class="rail-foot" id="railFoot">Saved on this device</div></div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => iso(new Date());
const monthKey = d => (typeof d === "string" ? d.slice(0, 7) : d.getFullYear() + "-" + pad(d.getMonth() + 1));
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = (mk, n) => { const [y, m] = mk.split("-").map(Number); return monthKey(new Date(y, m - 1 + n, 1)); };
const monthLabel = (mk, long) => new Date(mk + "-15T12:00:00").toLocaleDateString("en-GB", long ? {month:"long", year:"numeric"} : {month:"short"});
const fmtDate = s => s ? new Date(s + "T12:00:00").toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"}) : "—";
const rid = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const round2 = n => Math.round(n * 100) / 100;

const CATEGORIES = ["Rent & utilities","Equipment","Transport","Software","Supplies","Meals","Marketing","Salaries & fees","Other"];
const CAT_COLOR = {"Rent & utilities":"--pink","Equipment":"--lav","Transport":"--peach","Software":"--sky","Supplies":"--butter","Meals":"--clay","Marketing":"--mint","Salaries & fees":"--olive","Other":"--sage"};
const SERIES = ["--pink","--olive","--lav","--peach","--mint","--sky","--butter","--clay","--sage"];
const METHODS = ["Mobile Money","Bank transfer","Cash","Card","Cheque"];
const CURRENCIES = ["GHS","NGN","KES","ZAR","USD","EUR","GBP","XOF"];
const cssVar = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();

/* ---------- state & storage ---------- */
const LS_KEY = "cedi-ledger-v1";               // single-device mode (and data from before accounts)
const S = { records:{}, view:"dashboard", dashMonth:monthKey(new Date()), invFilter:"all", invSearch:"",
  expMonth:monthKey(new Date()), expCat:"", expSearch:"", modal:null, pendingImport:null, setTab:"profile", setConfirm:null, setMsg:null };

/* ---------- accounts (Supabase) ---------- */
const CFG = window.CEDI_CONFIG || {};
const CLOUD = !!(CFG.supabaseUrl && CFG.supabaseAnonKey && window.supabase && window.supabase.createClient);
const sb = CLOUD ? window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey,
  {auth:{flowType:"pkce", persistSession:true, autoRefreshToken:true, detectSessionInUrl:true}}) : null;
const A = { phase: CLOUD ? "checking" : "local", user:null, workspaces:[], ws:null, role:null, members:[], invites:[], profiles:{},
  channel:null, pendingInvite:null, inviteInfo:null, newLink:null, confirm:null,
  g:{tab:"signin", mode:"password", busy:false, ok:"", err:"", otpEmail:"", email:""} };
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const lsDel = k => { try { localStorage.removeItem(k); } catch {} };
const lsJSON = k => { try { return JSON.parse(localStorage.getItem(k) || "null"); } catch { return null; } };
const isManager = () => !CLOUD || A.role === "owner" || A.role === "admin";
const canDelete = () => isManager();
const canEditBiz = () => isManager();
const redirectURL = () => location.origin + location.pathname;
function memberName(uid) {
  if (!uid) return "";
  if (A.user && uid === A.user.id) return "you";
  const m = A.members.find(x => x.user_id === uid);
  return m ? (m.display_name || (m.email || "").split("@")[0]) : "a former member";
}
const LOCAL_PROFILE = "cedi-profile";
function myProfile() {
  if (!CLOUD) return {...(lsJSON(LOCAL_PROFILE) || {}), email:""};
  const u = A.user || {}, meta = u.user_metadata || {}, p = A.profiles[u.id] || lsJSON("cedi-myprof-" + u.id) || {};
  return {full_name:p.full_name || meta.full_name || meta.name || "", job_title:p.job_title || "", phone:p.phone || "", avatar:p.avatar || "", email:u.email || ""};
}
function avatarHTML(name, avatar, color, cls) {
  const inner = avatar ? `<img src="${avatar}" alt="">` : name ? esc(initials(name)) : `<span style="display:grid;width:55%;height:55%">${I.user}</span>`;
  return `<span class="avatar ${cls || ""}" style="background:var(${color || "--pink"})">${inner}</span>`;
}
function readAvatar(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error("Choose a photo (JPG or PNG)."));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("Couldn't read that photo."));
    fr.onload = () => { const img = new Image();
      img.onerror = () => reject(new Error("That photo format isn't supported. Try JPG or PNG."));
      img.onload = () => { const S2 = 256, c = document.createElement("canvas"); c.width = c.height = S2;
        const k = Math.max(S2 / img.width, S2 / img.height), w = img.width * k, h = img.height * k;
        const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, S2, S2); g.drawImage(img, (S2 - w) / 2, (S2 - h) / 2, w, h);
        resolve(c.toDataURL("image/jpeg", 0.85)); };
      img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
async function saveProfile(p) {
  if (!CLOUD) { lsSet(LOCAL_PROFILE, JSON.stringify(p)); return null; }
  const {error} = await sb.rpc("save_profile", {p_full_name:p.full_name || "", p_job_title:p.job_title || "", p_phone:p.phone || "", p_avatar:p.avatar || ""});
  if (error) return error;
  A.profiles[A.user.id] = {...(A.profiles[A.user.id] || {}), ...p, id:A.user.id};
  lsSet("cedi-myprof-" + A.user.id, JSON.stringify(A.profiles[A.user.id]));
  if ((A.user.user_metadata || {}).full_name !== p.full_name) {
    const r = await sb.auth.updateUser({data:{full_name:p.full_name}}); if (!r.error && r.data) A.user = r.data.user;
  }
  const m = A.members.find(x => x.user_id === A.user.id); if (m && p.full_name) m.display_name = p.full_name;
  return null;
}
function legacyRecords() { const r = lsJSON(LS_KEY) || {}; return Object.values(r).filter(x => x && x.kind); }

const cacheKey = () => CLOUD ? "cedi-cache-" + A.ws : LS_KEY;
function load() { try { S.records = JSON.parse(localStorage.getItem(cacheKey()) || "{}") || {}; } catch { S.records = {}; } }
function persist() {
  try { localStorage.setItem(cacheKey(), JSON.stringify(S.records)); return true; }
  catch { toast("Storage is full. Try a smaller logo, or remove old records."); return false; }
}
const cleanRec = rec => { const r = JSON.parse(JSON.stringify(rec)); delete r.example; delete r._by; delete r._at; return r; };
function put(rec) {
  rec = cleanRec(rec);
  S.records[rec.id] = CLOUD ? {...rec, _by:A.user?.id, _at:new Date().toISOString()} : rec;
  persist();
  if (CLOUD) queueWrite({op:"upsert", ws:A.ws, rec});
}
function remove(id) { delete S.records[id]; persist(); if (CLOUD) queueWrite({op:"delete", ws:A.ws, id}); }
function saveSettings(patch) { const cur = S.records.settings || {...DEFAULT_SETTINGS}; put({...cur, ...patch, id:"settings", kind:"settings"}); }

/* ---------- sync: offline outbox + live updates ---------- */
const OUTBOX = "cedi-outbox";
let outbox = lsJSON(OUTBOX) || [], flushing = false;
const opId = o => o.rec ? o.rec.id : o.id;
const saveOutbox = () => lsSet(OUTBOX, JSON.stringify(outbox));
const pendingCount = () => outbox.filter(o => o.ws === A.ws).length;
const isNetErr = e => !e || !e.code || /fetch|network|load failed|timeout/i.test(e.message || "");
function queueWrite(op) {
  outbox = outbox.filter(o => !(o.ws === op.ws && opId(o) === opId(op)));
  outbox.push(op); saveOutbox(); flush();
}
async function flush() {
  if (!CLOUD || flushing || !A.user || !navigator.onLine) return;
  flushing = true;
  try {
    while (outbox.length) {
      const o = outbox[0];
      const r = o.op === "upsert"
        ? await sb.from("records").upsert({workspace_id:o.ws, id:o.rec.id, kind:o.rec.kind, data:o.rec})
        : await sb.from("records").delete().eq("workspace_id", o.ws).eq("id", o.id);
      if (r.error) {
        if (isNetErr(r.error)) break;               // offline: keep it, retry later
        outbox.shift(); saveOutbox();              // refused by the server: drop it and show the truth
        toast(r.error.code === "42501" ? "Only owners and admins can make that change." : "A change couldn't be saved: " + r.error.message);
        if (o.ws === A.ws) await refetch();
        continue;
      }
      outbox.shift(); saveOutbox();
    }
  } finally { flushing = false; updateSyncNote(); }
}
window.addEventListener("online", () => { flush(); if (A.ws) refetch(); updateSyncNote(); render(); });
window.addEventListener("offline", () => { updateSyncNote(); render(); });

function rowToRec(r) { return {...r.data, id:r.id, _by:r.updated_by, _at:r.updated_at}; }
async function refetch() {
  if (!A.ws) return;
  const ws = A.ws, recs = {};
  for (let from = 0; ; from += 1000) {
    const {data, error} = await sb.from("records").select("id,kind,data,updated_by,updated_at").eq("workspace_id", ws).range(from, from + 999);
    if (error) return;                               // offline: keep the cached copy
    data.forEach(r => recs[r.id] = rowToRec(r));
    if (data.length < 1000) break;
  }
  if (ws !== A.ws) return;
  outbox.filter(o => o.ws === ws).forEach(o => { if (o.op === "upsert") recs[o.rec.id] = o.rec; else delete recs[o.id]; });
  S.records = recs; EXAMPLES = null; persist(); render();
}
let renderTimer;
function scheduleRender() {
  clearTimeout(renderTimer);
  renderTimer = setTimeout(() => {
    const a = document.activeElement;
    if (a && a.closest && a.closest("#view") && /INPUT|TEXTAREA|SELECT/.test(a.tagName)) return scheduleRender();
    render({skipModalForms:true});
  }, 250);
}
function subscribe(ws) {
  if (A.channel) { sb.removeChannel(A.channel); A.channel = null; }
  A.channel = sb.channel("ws-" + ws)
    .on("postgres_changes", {event:"*", schema:"public", table:"records", filter:"workspace_id=eq." + ws}, p => {
      if (ws !== A.ws) return;
      const id = p.eventType === "DELETE" ? p.old && p.old.id : p.new && p.new.id;
      if (!id || outbox.some(o => o.ws === ws && opId(o) === id)) return;
      if (p.eventType === "DELETE") delete S.records[id]; else S.records[id] = rowToRec(p.new);
      EXAMPLES = null; persist(); scheduleRender();
    })
    .on("postgres_changes", {event:"*", schema:"public", table:"members", filter:"workspace_id=eq." + ws}, () => loadTeam())
    .subscribe();
}
function updateSyncNote() {
  const el = document.getElementById("railFoot"); if (!el) return;
  if (!CLOUD) { const lb = (S.records.settings || {}).lastBackup; el.textContent = "Saved on this device" + (lb ? " · backed up " + fmtDate(lb) : ""); return; }
  const n = pendingCount();
  el.innerHTML = !navigator.onLine ? `<span class="sync off"><i></i>Offline${n ? ` · ${n} change${n > 1 ? "s" : ""} waiting` : ""}</span>`
    : n ? `<span class="sync off"><i></i>Syncing ${n}…</span>` : `<span class="sync"><i></i>Synced with your team</span>`;
}

/* ---------- workspaces & team ---------- */
async function loadWorkspaces() {
  const {data, error} = await sb.from("members").select("role, workspaces(id,name)").eq("user_id", A.user.id);
  if (error) { A.workspaces = lsJSON("cedi-wslist-" + A.user.id) || []; return; }
  A.workspaces = data.filter(r => r.workspaces).map(r => ({id:r.workspaces.id, name:r.workspaces.name, role:r.role}))
    .sort((a, b) => a.name.localeCompare(b.name));
  lsSet("cedi-wslist-" + A.user.id, JSON.stringify(A.workspaces));
}
async function openWorkspace(ws) {
  A.ws = ws; lsSet("cedi-ws-" + A.user.id, ws);
  const w = A.workspaces.find(x => x.id === ws); A.role = w ? w.role : "member";
  A.members = []; A.invites = []; A.newLink = null; S.setConfirm = null; S.setMsg = null;
  EXAMPLES = null; load(); A.phase = "ready"; showGate(false); render();
  subscribe(ws); refetch(); loadTeam(); flush();
}
async function loadTeam() {
  if (!A.ws) return;
  const ws = A.ws;
  const m = await sb.from("members").select("user_id,role,email,display_name,joined_at").eq("workspace_id", ws).order("joined_at");
  if (m.error || ws !== A.ws) return;
  const me = m.data.find(x => x.user_id === A.user.id);
  if (!me) { toast("You no longer have access to that business."); lsDel("cedi-cache-" + ws); await loadWorkspaces(); return routeAfterAuth(); }
  A.members = m.data; A.role = me.role;
  const w = A.workspaces.find(x => x.id === ws); if (w) w.role = me.role;
  const pr = await sb.from("profiles").select("id,full_name,job_title,phone,avatar").in("id", m.data.map(x => x.user_id));
  if (!pr.error) { pr.data.forEach(p => A.profiles[p.id] = p); if (A.profiles[A.user.id]) lsSet("cedi-myprof-" + A.user.id, JSON.stringify(A.profiles[A.user.id])); }
  if (isManager()) {
    const i = await sb.from("invites").select("token,role,created_at,expires_at,note").eq("workspace_id", ws)
      .is("used_at", null).gt("expires_at", new Date().toISOString()).order("created_at", {ascending:false});
    if (!i.error) A.invites = i.data;
  } else A.invites = [];
  render({skipModalForms:true});
}
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});

/* ---------- example data ---------- */
const DEFAULT_SETTINGS = {id:"settings", kind:"settings", currency:"GHS", taxRate:0, prefix:"INV", logo:"", terms:14, invoiceNotes:"Thank you for your business.",
  business:{name:"", email:"", phone:"", address:"", momo:"", bank:""}, budgets:{}};
let EXAMPLES = null;
function buildExamples() {
  const t = today(), cm = monthKey(new Date()), ex = {};
  const add = r => { r.example = true; ex[r.id] = r; };
  const clients = [
    {name:"Kantamanto Upcycle Collective", email:"hello@kantamanto.example", phone:"+233 24 000 1111", address:"Kantamanto Market, Accra"},
    {name:"Osu Arts Festival", email:"events@osuarts.example", phone:"+233 20 000 2222", address:"Oxford St, Osu, Accra"},
    {name:"Volta Clean Rivers Trust", email:"admin@voltarivers.example", phone:"+233 55 000 3333", address:"Ho, Volta Region"},
  ];
  const plan = [
    [-5,0,"paid",[["Documentary edit — 3 min cut",1,4200]]],
    [-4,1,"paid",[["Event coverage (full day)",1,3500],["Same-day highlight reel",1,1200]]],
    [-3,2,"paid",[["Drone b-roll package",1,2800]]],
    [-2,0,"paid",[["Social media cutdowns",6,450]]],
    [-1,1,"paid",[["Livestream production",1,5200]]],
    [-1,2,"sent",[["Colour grading — 12 min",1,2400]]],
    [0,0,"paid",[["Campaign teaser edit",1,4800]]],
    [0,1,"paid",[["Festival recap film",1,4200],["Photo stills package",1,950]]],
    [0,0,"sent",[["Campaign video — pre-production",1,3000],["Location scouting",2,350]]],
    [0,2,"draft",[["Annual report video",1,6500]]],
  ];
  let n = 1;
  plan.forEach(([mo, ci, st, items]) => {
    const mk = addMonths(cm, mo);
    let issue = mk + "-" + pad(2 + (n * 3) % 18); if (issue > t) issue = addDays(t, -3);
    const inv = {id:"inv-ex"+n, kind:"invoice", number:"INV-2026-"+String(n).padStart(3,"0"), client:clients[ci], issueDate:issue,
      dueDate:addDays(issue, 14), items:items.map(([desc, qty, price]) => ({desc, qty, price})), taxRate:0, discount:0,
      notes:"Thank you for working with us.", status:st, createdAt:issue};
    if (mo === -1 && st === "sent") inv.dueDate = addDays(t, -6);
    add(inv);
    if (st === "paid") {
      let pd = addDays(issue, 6); if (pd > t) pd = t;
      inv.paidDate = pd;
      add({id:"rct-ex"+n, kind:"receipt", number:"RCT-2026-"+String(n).padStart(3,"0"), invoiceId:inv.id, payer:clients[ci].name,
        amount:invoiceTotals(inv).total, method:n % 2 ? "Mobile Money" : "Bank transfer", date:pd, reference:"TXN"+(840021+n*37), note:"Payment for "+inv.number});
    }
    n++;
  });
  const exp = [["Rent & utilities","Studio rent — East Legon",2500,1,"Bank transfer"],["Rent & utilities","ECG prepaid top-up",420,4,"Mobile Money"],
    ["Software","Adobe Creative Cloud",610,5,"Card"],["Software","Frame.io review seats",240,6,"Card"],["Transport","Bolt rides to shoots",310,9,"Mobile Money"],
    ["Transport","Fuel — Volta trip",680,18,"Cash"],["Supplies","SD cards & batteries",540,14,"Cash"],["Meals","Crew lunch on set",360,16,"Mobile Money"],
    ["Marketing","Instagram promotion",300,20,"Card"],["Salaries & fees","Freelance sound recordist",1500,22,"Mobile Money"],["Equipment","Lavalier mic",950,11,"Card"]];
  let e = 1;
  for (let mo = -5; mo <= 0; mo++) {
    const mk = addMonths(cm, mo);
    exp.forEach(([cat, vendor, amt, d, m], i) => {

  let a0 = -Math.PI / 2, paths = "";
  const pt = (rad, a) => [C + rad * Math.cos(a), C + rad * Math.sin(a)];
  slices.forEach(s => {

    if (frac >= 0.9999) {

function attentionList(open) {

function recentList() {

function imgSize(dataUrl) { return new Promise(res => { const i = new Image(); i.onload = () => res([i.width, i.height]); i.onerror = () => res([1, 1]); i.src = dataUrl; }); }
async function pdfDoc(kind, rec) {

  const INK = [44, 42, 39], MUTED = [125, 119, 111], LINE = [232, 230, 227], PINK = [244, 196, 208], OLIVE = [197, 207, 159], TINT = [252, 236, 240];
  const font = (w, size, color) => { doc.setFont("helvetica", w); doc.setFontSize(size); doc.setTextColor(...(color || INK)); };
  const txt = (t, x, y, o) => doc.text(Array.isArray(t) ? t : String(t ?? ""), x, y, o);
  const label = (t, x, y, align) => { font("bold", 7.5, MUTED); doc.setCharSpace(0.6); txt(t.toUpperCase(), x, y, align ? {align} : undefined); doc.setCharSpace(0); };
  const hr = y => { doc.setDrawColor(...LINE); doc.setLineWidth(0.8); doc.line(M, y, R, y); };

  // colour band
  doc.setFillColor(...PINK); doc.rect(0, 0, W / 2, 8, "F"); doc.setFillColor(...OLIVE); doc.rect(W / 2, 0, W / 2, 8, "F");

  // header: logo + business (left), document title (right)
  let y = 50;
  if (st.logo) {
    const [lw, lh] = await imgSize(st.logo), k = Math.min(140 / lw, 52 / lh);
    try { doc.addImage(st.logo, "PNG", M, y, lw * k, lh * k); y += lh * k + 14; } catch {}
  }
  font("bold", 15); txt(b.name || "Your business", M, y + 4);
  font("normal", 9, MUTED);
  const bLines = [b.address, b.phone, b.email].filter(Boolean).flatMap(l => doc.splitTextToSize(String(l).replace(/\n/g, ", "), 240));
  bLines.forEach((l, i) => txt(l, M, y + 19 + i * 12.5));
  const leftBottom = y + 19 + bLines.length * 12.5;
  font("bold", 26); txt(kind === "invoice" ? "INVOICE" : "RECEIPT", R, 64, {align:"right"});
  font("normal", 10, MUTED); txt(rec.number, R, 82, {align:"right"});
  y = Math.max(leftBottom, 100) + 14; hr(y); y += 26;

  let stampAt = null;
  if (kind === "invoice") {
    const t = invoiceTotals(rec), paid = rec.status === "paid";
    // bill to (left) and dates (right)
    label("Bill to", M, y);
    font("bold", 11.5); txt(rec.client?.name || "-", M, y + 17);
    font("normal", 9.5, MUTED);
    const cLines = [rec.client?.address, rec.client?.phone, rec.client?.email].filter(Boolean).flatMap(l => doc.splitTextToSize(String(l), 250));
    cLines.forEach((l, i) => txt(l, M, y + 32 + i * 12.5));
    const meta = [["Invoice date", fmtDate(rec.issueDate)], ["Due date", fmtDate(rec.dueDate)]];
    if (rec.paidDate) meta.push(["Paid on", fmtDate(rec.paidDate)]);
    meta.forEach(([l, v], i) => { label(l, 400, y + i * 18, "right"); font("normal", 10); txt(v, R, y + i * 18, {align:"right"}); });
    y += Math.max(32 + cLines.length * 12.5, meta.length * 18) + 26;

    // items table: description | qty | rate | amount (numbers right-aligned in fixed columns)
    const cQty = 345, cRate = 445, cAmt = R - 10;
    doc.setFillColor(...TINT); doc.roundedRect(M, y - 15, R - M, 24, 4, 4, "F");
    label("Description", M + 10, y); label("Qty", cQty, y, "right"); label("Rate", cRate, y, "right"); label("Amount", cAmt, y, "right");
    y += 26;
    (rec.items || []).forEach(it => {
      if (y > H - 200) { doc.addPage(); y = 60; }
      font("normal", 10);
      const lines = doc.splitTextToSize(it.desc || "", cQty - M - 60);
      txt(lines, M + 10, y);
      txt(String(num(it.qty)), cQty, y, {align:"right"});
      txt(moneyPlain(num(it.price)), cRate, y, {align:"right"});
      font("bold", 10); txt(moneyPlain(num(it.qty) * num(it.price)), cAmt, y, {align:"right"});
      y += lines.length * 13 + 9; hr(y - 4); y += 12;
    });

    // totals block, right side
    y += 4;
    const tl = 360;
    const row = (l, v) => { font("normal", 10, MUTED); txt(l, tl, y); font("normal", 10); txt(v, cAmt, y, {align:"right"}); y += 17; };
    row("Subtotal", moneyPlain(t.sub));
    if (t.disc) row("Discount", "- " + moneyPlain(t.disc));
    if (num(rec.taxRate)) row("Tax (" + num(rec.taxRate) + "%)", moneyPlain(t.tax));
    y += 2; doc.setFillColor(...(paid ? [242, 245, 230] : TINT)); doc.roundedRect(tl - 12, y - 6, cAmt - tl + 22, 30, 5, 5, "F");
    font("bold", 12); txt(paid ? "Total paid" : "Total due", tl, y + 13); txt(moneyPlain(t.total), cAmt, y + 13, {align:"right"});
    const totalsTop = y;
    y += 50;

    // payment details + notes
    const pd = payDetails(), mr = momoRows(pd), br = bankRows(pd);
    if ((mr.length || br.length) && !paid) {
      // Measure first so the box never splits across pages.
      const cols = [mr.length && ["Mobile Money", mr], br.length && ["Bank transfer", br]].filter(Boolean);
      const colW = cols.length === 2 ? (R - M - 44) / 2 : R - M - 24, lw = 82, vw = colW - lw - 6;
      font("normal", 9.5);
      const colH = cols.map(([, rows]) => 16 + rows.reduce((h, [, v]) => h + doc.splitTextToSize(String(v), vw).length * 12 + 4, 0));
      const boxH = 26 + Math.max(...colH) + 26;
      if (y + boxH > H - 70) { doc.addPage(); y = 60; }
      doc.setDrawColor(...LINE); doc.setFillColor(252, 251, 250); doc.roundedRect(M, y, R - M, boxH, 6, 6, "FD");
      label("How to pay", M + 12, y + 18);
      cols.forEach(([title, rows], ci) => {
        const x = M + 12 + ci * (colW + 20); let yy = y + 38;
        font("bold", 10.5); txt(title, x, yy); yy += 16;
        rows.forEach(([l, v]) => {
          font("normal", 8.5, MUTED); txt(l, x, yy);
          font("normal", 9.5); const ls = doc.splitTextToSize(String(v), vw); txt(ls, x + lw, yy);
          yy += ls.length * 12 + 4;
        });
      });
      font("normal", 9, MUTED); txt("Please use " + rec.number + " as your payment reference.", M + 12, y + boxH - 12);
      y += boxH + 22;
    }
    if (paid) y = Math.max(y, totalsTop + 86);
    if (rec.notes) { label("Notes", M, y); y += 15; font("normal", 9.5, MUTED); txt(doc.splitTextToSize(rec.notes, R - M), M, y); }
    if (paid) stampAt = [M + 10, totalsTop - 30, 170, 98, rec.paidDate || today()];
  } else {
    const inv = rec.invoiceId && data()[rec.invoiceId];
    label("Amount received", M, y);
    font("bold", 30); txt(moneyPlain(num(rec.amount)), M, y + 34);
    y += 70;
    [["Received from", rec.payer], ["Payment date", fmtDate(rec.date)], ["Payment method", rec.method], rec.reference && ["Transaction ref.", rec.reference],
     inv && ["For invoice", inv.number], rec.note && ["Note", rec.note]].filter(Boolean).forEach(([l, v]) => {
      label(l, M, y); font(l === "Received from" ? "bold" : "normal", 10.5); const ls = doc.splitTextToSize(String(v), 300); txt(ls, 175, y); y += Math.max(1, ls.length) * 13 + 11;

  font("normal", 8, MUTED);

  txt("Generated " + fmtDate(today()), R, H - 36, {align:"right"});
  return doc.output("blob");
}

const newExpenseDraft = () => ({id:rid("exp"), kind:"expense", date:today(), vendor:"", amount:0, category:CATEGORIES[0], method:METHODS[0], note:""});
const newReceiptDraft = inv => ({id:rid("rct"), kind:"receipt", number:nextNumber("receipt"), date:today(), payer:inv ? inv.client?.name || "" : "",
  amount:inv ? invoiceTotals(inv).total : 0, method:METHODS[0], reference:"", note:inv ? "Payment for " + inv.number : "", invoiceId:inv ? inv.id : ""});

/* ---------- actions ---------- */
async function act(a, el) {
  const m = S.modal;
  switch (a) {
    case "close": closeModal(); if (el.getAttribute && el.getAttribute("href")) location.hash = el.getAttribute("href").slice(1); break;
    case "dismiss-examples": if (CLOUD) lsSet("cedi-ex-off-" + A.ws, "1"); else saveSettings({examplesDismissed:true}); render(); toast("Ledger cleared. Add your first record."); break;
    case "dash-month": S.dashMonth = addMonths(S.dashMonth, +el.dataset.dir); render(); break;
    case "inv-filter": S.invFilter = el.dataset.v; render(); break;
    case "exp-allmonths": S.expMonth = S.expMonth ? "" : monthKey(new Date()); render(); break;
    case "new-invoice": openModal({type:"invoiceForm", isNew:true, draft:newInvoiceDraft()}); break;
    case "edit-invoice": openModal({type:"invoiceForm", isNew:false, draft:JSON.parse(JSON.stringify(data()[m.id]))}); break;
    case "view-invoice": openModal({type:"invoiceView", id:el.dataset.id}); break;
    case "add-item": syncInvoiceDraft(); m.draft.items.push({desc:"", qty:1, price:0}); renderModal(); document.getElementById("it" + (m.draft.items.length - 1) + "d")?.focus(); break;
    case "rm-item": syncInvoiceDraft(); m.draft.items.splice(+el.dataset.i, 1); renderModal(); break;
    case "save-invoice": {
      const f = $("#invForm"); if (!f.reportValidity()) return;
      syncInvoiceDraft(); const d = m.draft;
      d.items = d.items.filter(it => it.desc || num(it.price));
      if (!d.items.length) { d.items = [{desc:"", qty:1, price:0}]; renderModal(); toast("Add at least one line item."); return; }
      const bn = (m.bizName ?? "").trim();
      if (canEditBiz() && m.bizName !== undefined && bn !== settings().business.name) saveSettings({business:{...settings().business, name:bn}});
      if (d.status === "paid" && !d.paidDate) d.paidDate = today();
      if (d.status !== "paid") delete d.paidDate;
      put(d); toast(m.isNew ? "Invoice " + d.number + " created" : "Invoice saved");
      if (S.view !== "invoices") location.hash = "invoices"; else render();
      openModal({type:"invoiceView", id:d.id}); break;
    }
    case "mark-sent": put({...data()[m.id], status:"sent"}); toast("Marked as sent"); render(); break;
    case "pay-invoice": openModal({type:"receiptForm", isNew:true, draft:newReceiptDraft(data()[m.id])}); break;
    case "text-invoice": shareText(invoiceShareText(data()[m.id]), data()[m.id].number); break;
    case "pdf-invoice": sharePdf("invoice", data()[m.id]); break;
    case "new-receipt": openModal({type:"receiptForm", isNew:true, draft:newReceiptDraft(null)}); break;
    case "view-receipt": openModal({type:"receiptView", id:el.dataset.id}); break;
    case "edit-receipt": openModal({type:"receiptForm", isNew:false, draft:JSON.parse(JSON.stringify(data()[m.id]))}); break;
    case "save-receipt": {
      const f = $("#rctForm"); if (!f.reportValidity()) return;
      const d = readForm(f, m.draft);
      if (d.invoiceId) { const inv = data()[d.invoiceId]; if (inv && inv.status !== "paid") put({...inv, status:"paid", paidDate:d.date}); }
      put(d); toast("Receipt " + d.number + " issued"); render(); openModal({type:"receiptView", id:d.id}); break;
    }
    case "text-receipt": shareText(receiptShareText(data()[m.id]), data()[m.id].number); break;
    case "pdf-receipt": sharePdf("receipt", data()[m.id]); break;
    case "new-expense": openModal({type:"expenseForm", isNew:true, draft:newExpenseDraft()}); break;
    case "edit-expense": openModal({type:"expenseForm", isNew:false, draft:JSON.parse(JSON.stringify(data()[el.dataset.id]))}); break;
    case "save-expense": {
      const f = $("#expForm"); if (!f.reportValidity()) return;
      put(readForm(f, m.draft)); toast(m.isNew ? "Expense added" : "Expense saved"); S.modal = null; render(); break;
    }
    case "ask-delete": m.confirmDelete = true; renderModal(); break;
    case "cancel-delete": m.confirmDelete = false; renderModal(); break;
    case "do-delete": {
      const id = m.id || m.draft?.id, rec = data()[id];
      if (!canDelete()) { m.confirmDelete = false; renderModal(); toast("Only owners and admins can delete records."); return; }
      if (rec && rec.example) { m.confirmDelete = false; renderModal(); toast("Examples can't be deleted. Use “Start with an empty ledger”."); return; }
      if (rec && rec.kind === "receipt" && rec.invoiceId && S.records[rec.invoiceId]?.status === "paid") { const inv = {...S.records[rec.invoiceId], status:"sent"}; delete inv.paidDate; put(inv); }
      remove(id); S.modal = null; render(); toast("Deleted"); break;
    }
    case "remove-logo": saveSettings({logo:""}); render(); toast("Logo removed"); break;
    case "clear-momo": if (canEditBiz()) { savePay({momo:{}}); render(); toast("Mobile Money removed from invoices"); } break;
    case "clear-bank": if (canEditBiz()) { savePay({bank:{}}); render(); toast("Bank details removed from invoices"); } break;
    case "remove-logo-form": syncInvoiceDraft(); saveSettings({logo:""}); renderModal(); toast("Logo removed"); break;
    case "export-csv": {
      const rows = all("expense").filter(e => !S.expMonth || monthKey(e.date) === S.expMonth).sort((a, b) => a.date.localeCompare(b.date));
      if (!rows.length) { toast("No expenses to export."); return; }
      const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
      const csv = ["Date,Vendor,Category,Paid with,Amount (" + settings().currency + "),Note", ...rows.map(e => [e.date, q(e.vendor), q(e.category), q(e.method), num(e.amount).toFixed(2), q(e.note)].join(","))].join("\n");
      shareFile(new Blob([csv], {type:"text/csv"}), "expenses-" + (S.expMonth || "all") + ".csv", "Expenses"); break;
    }
    case "export-backup": {
      const blob = new Blob([JSON.stringify({app:"cedi-ledger", version:1, exported:new Date().toISOString(), records:S.records}, null, 1)], {type:"application/json"});
      await shareFile(blob, "cedi-ledger-backup-" + today() + ".json", "Cedi Ledger backup");
      if (!CLOUD) saveSettings({lastBackup:today()}); render(); break;
    }
    case "cancel-import": S.pendingImport = null; render(); break;
    case "confirm-import": {
      if (CLOUD) {
        if (!isManager()) { S.pendingImport = null; render(); return; }
        const recs = Object.values(S.pendingImport.records).filter(r => r && r.kind && r.id);
        recs.forEach(r => put(r)); S.pendingImport = null; EXAMPLES = null; render(); toast(recs.length + " records added. Syncing to your team…"); break;
      }
      S.records = S.pendingImport.records; S.pendingImport = null; persist(); EXAMPLES = null; render(); toast("Backup restored"); break;
    }
    case "import-legacy": {
      if (!isManager()) return;
      const recs = legacyRecords(); recs.forEach(r => put(r)); EXAMPLES = null; render(); toast(recs.length + " records brought over. Syncing to your team…"); break;
    }
    case "create-invite": {
      const role = $("#invRole").value, note = $("#invNote").value.trim() || null;
      const {data, error} = await sb.from("invites").insert({workspace_id:A.ws, role, note}).select("token,role,note,created_at,expires_at").single();
      if (error) { toast(isNetErr(error) ? "Connect to the internet to create an invite." : "Couldn't create the invite: " + error.message); return; }
      A.newLink = data; A.invites = [data, ...A.invites]; render(); break;
    }
    case "share-invite": {
      const name = (A.workspaces.find(w => w.id === A.ws) || {}).name || "our business";
      shareText(`You're invited to join ${name} on Cedi Ledger. Open this link to sign up and get access:
${inviteURL(el.dataset.token)}`, "Join " + name); break;
    }
    case "copy-invite": copyText(inviteURL(el.dataset.token)); break;
    case "revoke-invite": {
      const {error} = await sb.from("invites").delete().eq("token", el.dataset.token);
      if (error) { toast("Couldn't revoke: " + error.message); return; }
      A.invites = A.invites.filter(i => i.token !== el.dataset.token); if (A.newLink && A.newLink.token === el.dataset.token) A.newLink = null;
      render(); toast("Invite revoked"); break;
    }
    case "ask-remove-member": S.setConfirm = {type:"remove", id:el.dataset.id}; render(); break;
    case "ask-transfer": S.setConfirm = {type:"transfer", id:$("#xferTo").value}; render(); break;
    case "ask-leave": S.setConfirm = {type:"leave"}; render(); break;
    case "ask-signout": S.setConfirm = {type:"signout"}; render(); break;
    case "cancel-confirm": S.setConfirm = null; render(); break;
    case "do-remove-member": {
      const {error} = await sb.from("members").delete().eq("workspace_id", A.ws).eq("user_id", el.dataset.id);
      S.setConfirm = null; if (error) toast("Couldn't remove: " + error.message); else toast("Removed from the team"); loadTeam(); break;
    }
    case "do-transfer": {
      const {error} = await sb.rpc("transfer_ownership", {p_workspace:A.ws, p_user:S.setConfirm.id});
      S.setConfirm = null; if (error) toast(error.message); else { toast("Ownership transferred"); await loadWorkspaces(); } loadTeam(); break;
    }
    case "do-leave": {
      const ws = A.ws, {error} = await sb.from("members").delete().eq("workspace_id", ws).eq("user_id", A.user.id);
      S.setConfirm = null; if (error) { toast("Couldn't leave: " + error.message); render(); return; }
      lsDel("cedi-cache-" + ws); if (A.channel) { sb.removeChannel(A.channel); A.channel = null; }
      A.ws = null; toast("You left the business"); routeAfterAuth(); break;
    }
    case "switch-ws": S.modal = null; location.hash = "dashboard"; openWorkspace(el.dataset.id); toast("Switched business"); break;
    case "sign-out": signOut("local"); break;
    case "ask-signout-all": S.setConfirm = {type:"signout-all"}; render(); break;
    case "sign-out-all": signOut("global"); break;
    case "ask-delete-ws": S.setConfirm = {type:"delete-ws"}; render(); setTimeout(() => $("#delWsName")?.focus(), 30); break;
    case "do-delete-ws": {
      const cur = A.workspaces.find(w => w.id === A.ws) || {};
      if (($("#delWsName").value || "").trim() !== (cur.name || "").trim()) { toast("Type the business name exactly to confirm."); return; }
      const ws = A.ws, {error} = await sb.from("workspaces").delete().eq("id", ws);
      if (error) { toast(isNetErr(error) ? "Connect to the internet to delete a business." : error.message); return; }
      S.setConfirm = null; lsDel("cedi-cache-" + ws); outbox = outbox.filter(o => o.ws !== ws); saveOutbox();
      if (A.channel) { sb.removeChannel(A.channel); A.channel = null; }
      A.ws = null; toast(cur.name + " was deleted"); location.hash = "dashboard"; routeAfterAuth(); break;
    }
    case "ask-delete-account": S.setConfirm = {type:"delete-account"}; render(); setTimeout(() => $("#delAcc")?.focus(), 30); break;
    case "do-delete-account": {
      if (($("#delAcc").value || "").trim().toUpperCase() !== "DELETE") { toast("Type DELETE to confirm."); return; }
      const {error} = await sb.rpc("delete_my_account");
      if (error) { S.setMsg = {type:"err", text:isNetErr(error) ? "Connect to the internet to delete your account." : error.message}; S.setConfirm = null; render(); return; }
      lsDel("cedi-myprof-" + A.user.id); S.setConfirm = null; await signOut("local"); toast("Your account was deleted"); break;
    }
    case "ask-erase": S.setConfirm = {type:"erase"}; render(); setTimeout(() => $("#eraseTxt")?.focus(), 30); break;
    case "do-erase": {
      if (($("#eraseTxt").value || "").trim().toUpperCase() !== "ERASE") { toast("Type ERASE to confirm."); return; }
      lsDel(LS_KEY); lsDel(LOCAL_PROFILE); S.records = {}; EXAMPLES = null; S.setConfirm = null; location.hash = "dashboard"; render(); toast("This device was erased"); break;
    }
    case "refresh-data": lsDel(cacheKey()); await refetch(); await loadTeam(); toast("Reloaded from your account"); break;
    case "remove-avatar": {
      const p = {...myProfile(), ...readProfileForm(), avatar:""}; delete p.email;
      const err = await saveProfile(p); toast(err ? "Couldn't remove photo: " + err.message : "Photo removed"); render(); break;
    }
  }
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const a = el.dataset.action;
  if (a === "overlay") { if (e.target === el) closeModal(); return; }
  if (el.tagName === "LABEL") return;
  e.preventDefault();
  if (a.startsWith("g-")) { gateAction(a, el); return; }
  act(a, el);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.modal) closeModal(); });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "invSearch") { S.invSearch = t.value; rerenderKeepFocus(t.id); }
  else if (t.id === "expSearch") { S.expSearch = t.value; rerenderKeepFocus(t.id); }
  else if (t.closest("#invForm")) {
    syncInvoiceDraft(); const d = S.modal.draft;
    d.items.forEach((it, i) => { const c = document.getElementById("it" + i + "t"); if (c) c.textContent = money(num(it.qty) * num(it.price)); });
    $("#invTotals").innerHTML = totalsHTML(invoiceTotals(d), d);
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "dashMonth" && t.value) { S.dashMonth = t.value; render(); }
  else if (t.id === "expMonth") { S.expMonth = t.value; render(); }
  else if (t.id === "expCat") { S.expCat = t.value; render(); }
  else if (t.dataset && t.dataset.roleFor) {
    const {error} = await sb.from("members").update({role:t.value}).eq("workspace_id", A.ws).eq("user_id", t.dataset.roleFor);
    toast(error ? "Couldn't change role: " + error.message : "Role updated"); loadTeam();
  }
  else if (t.id === "avatarInput") {
    try {
      const url = await readAvatar(t.files[0]), p = {...myProfile(), ...readProfileForm(), avatar:url}; delete p.email;
      const err = await saveProfile(p); toast(err ? (isNetErr(err) ? "Connect to the internet to change your photo." : err.message) : "Photo updated"); render();
    } catch (err) { toast(err.message); }
  }
  else if (t.id === "formLogoInput") {
    syncInvoiceDraft();
    try { const url = await readLogo(t.files[0]); saveSettings({logo:url}); render(); toast("Logo added"); }
    catch (err) { toast(err.message); }
  }
  else if (t.id === "logoInput") {
    try { const url = await readLogo(t.files[0]); saveSettings({logo:url}); render(); toast("Logo added to your invoices and receipts"); }
    catch (err) { toast(err.message); }
  } else if (t.id === "importInput") {
    const f = t.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      if (!j || j.app !== "cedi-ledger" || typeof j.records !== "object") throw 0;
      S.pendingImport = {records:j.records, name:f.name, count:Object.values(j.records).filter(r => r.kind !== "settings").length}; render();
    } catch { toast("That file isn't a Cedi Ledger backup."); }
  }
});
function rerenderKeepFocus(id) {
  const el = document.getElementById(id), pos = el.selectionStart; render();
  const n = document.getElementById(id); n.focus(); try { n.setSelectionRange(pos, pos); } catch {}
}
document.addEventListener("submit", async e => {
  e.preventDefault(); const f = e.target;
  if (f.closest && f.closest("#gate")) { gateSubmit(f.id); return; }
  if (f.id === "profileForm") {
    const p = {...myProfile(), ...readProfileForm()}; delete p.email;
    const err = await saveProfile(p);
    if (err) { toast(isNetErr(err) ? "Connect to the internet to save your profile." : err.message); return; }
    toast("Profile saved"); render(); return;
  }
  if (f.id === "emailForm") {
    const email = $("#acEmail").value.trim(); if (!email) return;
    const {data, error} = await sb.auth.updateUser({email}, {emailRedirectTo:redirectURL()});
    if (error) { toast(friendlyAuthError(error)); return; }
    if (data && data.user) A.user = data.user;
    S.setMsg = {type:"ok", text:"Check " + email + " for a confirmation link. Your sign-in email changes once you confirm."}; render(); return;
  }
  if (f.id === "passForm") {
    const p = $("#acPass").value, p2 = $("#acPass2").value;
    if (p.length < 8) { toast("Use at least 8 characters."); return; }
    if (p !== p2) { toast("The two passwords don't match."); return; }
    const {error} = await sb.auth.updateUser({password:p});
    if (error) { toast(friendlyAuthError(error)); return; }
    S.setMsg = {type:"ok", text:"Password updated."}; render(); return;
  }
  if (f.id === "newWsForm") {
    const name = $("#newWsName").value.trim(); if (!name) return;
    const {data:ws, error} = await sb.rpc("create_workspace", {p_name:name});
    if (error) { toast(isNetErr(error) ? "Connect to the internet to create a business." : error.message); return; }
    await loadWorkspaces(); location.hash = "dashboard"; openWorkspace(ws); toast(name + " is ready"); return;
  }
  if (f.id === "momoForm" || f.id === "bankForm") {
    if (!canEditBiz()) return;
    if (!f.reportValidity()) return;
    const v = {}; f.querySelectorAll("[name]").forEach(el => v[el.name] = el.value.trim());
    if (f.id === "momoForm") { savePay({momo:v}); toast(v.number ? "Mobile Money details saved" : "Saved"); }
    else { v.swift = (v.swift || "").toUpperCase(); savePay({bank:v}); toast(v.accountNumber || v.bankName ? "Bank details saved" : "Saved"); }
    render(); return;
  }
  if (f.id === "budgetForm") {
    if (!canEditBiz()) return;
    const budgets = {}; f.querySelectorAll("input").forEach(i => { if (num(i.value) > 0) budgets[i.name] = num(i.value); });
    saveSettings({budgets}); render(); toast("Budgets saved");
  } else if (f.id === "bizForm") {
    if (!canEditBiz()) return;
    const v = readForm(f, {});
    saveSettings({business:{...((S.records.settings || {}).business || {}), name:v.name, email:v.email, phone:v.phone, address:v.address}, currency:v.currency, taxRate:num(v.taxRate),
      terms:Math.max(0, Math.min(365, Math.round(num(v.terms)))), invoiceNotes:v.invoiceNotes,
      prefix:(v.prefix || "INV").replace(/[^A-Za-z0-9]/g, "").toUpperCase() || "INV"});
    if (CLOUD && v.name) {
      const w = A.workspaces.find(x => x.id === A.ws);
      if (w && w.name !== v.name) { const {error} = await sb.from("workspaces").update({name:v.name}).eq("id", A.ws); if (!error) { w.name = v.name; lsSet("cedi-wslist-" + A.user.id, JSON.stringify(A.workspaces)); } }
    }
    render(); toast("Business settings saved");
  } else if (f.id === "invForm") act("save-invoice");
  else if (f.id === "rctForm") act("save-receipt");
  else if (f.id === "expForm") act("save-expense");
});
