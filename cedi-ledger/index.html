function friendlyAuthError(e) {
  const m = (e && (e.message || e.error_description || String(e))) || "";
  if (/invalid login credentials/i.test(m)) return "That email and password don't match. Try again, or reset your password.";
  if (/email not confirmed/i.test(m)) return "Please confirm your email first. Check your inbox for the confirmation link.";
  if (/already registered|already been registered|user already exists/i.test(m)) return "An account with this email already exists. Sign in instead.";
  if (/rate limit|too many/i.test(m)) return "Too many attempts. Wait a few minutes and try again.";
  if (/token has expired|invalid.*(otp|token)|otp.*(expired|invalid)/i.test(m)) return "That code is wrong or has expired. Request a new one.";
  if (/password should be|password is too short|weak password/i.test(m)) return "Use a password with at least 8 characters.";
  if (/fetch|network|load failed/i.test(m)) return "You're offline. Connect to the internet to sign in.";
  if (/provider is not enabled|unsupported provider/i.test(m)) return "Google sign-in isn't switched on yet. Use email instead.";
  return m || "Something went wrong. Try again.";
}
const isStandalone = () => { try { return matchMedia("(display-mode: standalone)").matches || navigator.standalone === true; } catch { return false; } };
function showGate(on) { if (!on) $("#gate").innerHTML = ""; $("#gate").hidden = !on; $("#app").hidden = on; $("#tabbar").hidden = on; if (on) { S.modal = null; renderModal(); } }
const brandBlock = (title, sub) => `<div class="gate-brand"><div class="brand-mark"><span>₵</span></div><h1>${title}</h1>${sub ? `<p>${sub}</p>` : ""}</div>`;
const msgs = () => (A.g.err ? `<div class="msg err" role="alert">${esc(A.g.err)}</div>` : "") + (A.g.ok ? `<div class="msg ok" role="status">${esc(A.g.ok)}</div>` : "");
function renderGate() {
  if (!CLOUD || A.phase === "ready") { showGate(false); return; }
  showGate(true);
  const g = A.g, busy = g.busy ? "disabled" : "";
  let body = "";
  if (A.phase === "checking" || A.phase === "loading") {
    body = brandBlock("Cedi Ledger", A.phase === "loading" ? "Opening your books…" : "") + `<div class="spinner" role="status" aria-label="Loading"></div>`;
  } else if (A.phase === "signed-out") {
    const inv = lsGet("cedi-pending-invite");
    body = brandBlock(g.tab === "signup" ? "Create your account" : "Welcome back", inv ? "Sign in or create an account to join your team's ledger." : "Invoices, receipts and expenses for your whole team.");
    if (g.mode === "otp-sent") {
      body += msgs() + (CFG.emailCodes ? `<form id="otpForm"><p>We emailed a sign-in link and a 6-digit code to <b>${esc(g.otpEmail)}</b>. Tap the link, or type the code here. The code works best inside the installed app.</p>
        <div class="field"><label for="otpCode">6-digit code</label><input type="text" id="otpCode" class="code-input" inputmode="numeric" autocomplete="one-time-code" maxlength="8" required></div>
        <button class="btn primary block" ${busy}>Sign in</button></form>`
        : `<p>We emailed a sign-in link to <b>${esc(g.otpEmail)}</b>. Open it on this device to sign in. The link works once and expires after an hour.</p>
        ${isStandalone() ? `<div class="msg ok">On iPhone, email links open in Safari rather than this app. To sign in here, use your password instead.</div>` : ""}`)
        + `<div class="gate-links"><button class="linkbtn" data-action="g-mode" data-v="password">Use a password instead</button><button class="linkbtn" data-action="g-resend">Send a new ${CFG.emailCodes ? "code" : "link"}</button></div>`;
    } else if (g.mode === "magic") {
      body += msgs() + `<form id="magicForm"><div class="field"><label for="gEmail">Email</label><input type="email" id="gEmail" autocomplete="email" value="${esc(g.email)}" required></div>
        ${isStandalone() && !CFG.emailCodes ? `<p class="muted">The link will open in Safari. To sign in inside this app, use your password.</p>` : ""}
        <button class="btn primary block" ${busy}>Email me a sign-in ${CFG.emailCodes ? "code" : "link"}</button></form>
        <div class="gate-links"><button class="linkbtn" data-action="g-mode" data-v="password">Use a password instead</button></div>`;
    } else if (g.mode === "forgot") {
      body += msgs() + `<form id="forgotForm"><p>Enter your email and we'll send you a link to set a new password.</p>
        <div class="field"><label for="gEmail">Email</label><input type="email" id="gEmail" autocomplete="email" value="${esc(g.email)}" required></div>
        <button class="btn primary block" ${busy}>Send reset link</button></form>
        <div class="gate-links"><button class="linkbtn" data-action="g-mode" data-v="password">Back to sign in</button></div>`;
    } else {
      body += `<div class="chips" style="align-self:center"><button class="chip" data-action="g-tab" data-v="signin" aria-pressed="${g.tab === "signin"}">Sign in</button><button class="chip" data-action="g-tab" data-v="signup" aria-pressed="${g.tab === "signup"}">Create account</button></div>`
        + (CFG.googleEnabled ? `<button class="btn block google" data-action="g-google" ${busy}>${GOOGLE_SVG}Continue with Google</button><div class="divider">or</div>` : "")
        + msgs() + `<form id="${g.tab === "signup" ? "signupForm" : "signinForm"}">
          ${g.tab === "signup" ? `<div class="field"><label for="gName">Your name</label><input type="text" id="gName" autocomplete="name" required></div>` : ""}
          <div class="field"><label for="gEmail">Email</label><input type="email" id="gEmail" autocomplete="email" value="${esc(g.email)}" required></div>
          <div class="field"><label for="gPass">Password</label><input type="password" id="gPass" autocomplete="${g.tab === "signup" ? "new-password" : "current-password"}" minlength="${g.tab === "signup" ? 8 : 1}" required>${g.tab === "signup" ? '<span class="muted">At least 8 characters</span>' : ""}</div>
          <button class="btn primary block" ${busy}>${g.tab === "signup" ? "Create account" : "Sign in"}</button></form>
        <div class="gate-links"><button class="linkbtn" data-action="g-mode" data-v="magic">Email me a sign-in ${CFG.emailCodes ? "code" : "link"} instead</button>${g.tab === "signin" ? '<button class="linkbtn" data-action="g-mode" data-v="forgot">Forgot password?</button>' : ""}</div>`;
    }
  } else if (A.phase === "recovery") {
    body = brandBlock("Set a new password", "Choose a new password for " + esc(A.user?.email || "your account") + ".") + msgs()
      + `<form id="recoveryForm"><div class="field"><label for="gPass">New password</label><input type="password" id="gPass" autocomplete="new-password" minlength="8" required></div>
         <div class="field"><label for="gPass2">Confirm password</label><input type="password" id="gPass2" autocomplete="new-password" minlength="8" required></div>
         <button class="btn primary block" ${busy}>Save password</button></form>`;
  } else if (A.phase === "invite") {
    const i = A.inviteInfo;
    body = brandBlock("Join " + esc(i.workspace_name), esc(i.invited_by || "A teammate") + " invited you to join as " + (i.role === "admin" ? "an admin" : "a member") + ".") + msgs()
      + `<button class="btn primary block" data-action="g-accept" ${busy}>Join ${esc(i.workspace_name)}</button>
         <button class="btn block" data-action="g-decline" ${busy}>Not now</button>
         <p class="byline" style="text-align:center">Signed in as ${esc(A.user.email)} · <button class="linkbtn" data-action="sign-out">Sign out</button></p>`;
  } else if (A.phase === "create") {
    const legacy = legacyRecords().filter(r => r.kind !== "settings").length;
    body = brandBlock("Set up your business", "Name the business whose books you'll keep. You can invite your team next.") + msgs()
      + `<form id="createWsForm"><div class="field"><label for="wsName">Business name</label><input type="text" id="wsName" maxlength="120" placeholder="e.g. Asante Media Ltd." required></div>
         ${legacy ? `<label class="check"><input type="checkbox" id="wsImport" checked><span>Bring over the <b>${legacy}</b> record${legacy > 1 ? "s" : ""} already saved on this device</span></label>` : ""}
         <button class="btn primary block" ${busy}>Create business</button></form>
         <p class="muted" style="text-align:center">Joining a teammate's business? Open the invite link they sent you.</p>
         <p class="byline" style="text-align:center">Signed in as ${esc(A.user.email)} · <button class="linkbtn" data-action="sign-out">Sign out</button></p>`;
  }
  $("#gate").innerHTML = `<div class="gate-card">${body}<p class="byline" style="text-align:center;margin:4px 0 0"><a class="sub" href="privacy.html">Privacy policy</a></p></div>`;
}
function gateSet(patch) { Object.assign(A.g, patch); renderGate(); }

async function routeAfterAuth() {
  A.phase = "loading"; renderGate();
  const tok = lsGet("cedi-pending-invite");
  if (tok && navigator.onLine) {
    const {data, error} = await sb.rpc("invite_info", {p_token:tok});
    if (!error && data && data[0]) {
      A.pendingInvite = tok; A.inviteInfo = data[0];
      await loadWorkspaces();
      A.phase = "invite"; A.g.err = ""; A.g.ok = ""; renderGate(); return;
    }
    lsDel("cedi-pending-invite"); A.pendingInvite = null; A.inviteInfo = null;
    A.g.err = "That invite link has expired or was already used. Ask for a new one.";
  }
  await loadWorkspaces();
  sb.rpc("sync_my_email").then(() => {}, () => {});
  if (!A.workspaces.length) { A.phase = "create"; renderGate(); return; }
  const last = lsGet("cedi-ws-" + A.user.id);
  openWorkspace(A.workspaces.some(w => w.id === last) ? last : A.workspaces[0].id);
}
function cleanAuthParams() {
  const u = new URL(location.href); let changed = false;
  ["code", "error", "error_code", "error_description", "type"].forEach(k => { if (u.searchParams.has(k)) { u.searchParams.delete(k); changed = true; } });
  if (changed) history.replaceState(null, "", u.pathname + (u.searchParams.toString() ? "?" + u.searchParams : "") + u.hash);
}
function initAuth() {
  const u = new URL(location.href);
  if (u.searchParams.get("error_description")) A.g.err = friendlyAuthError(u.searchParams.get("error_description"));
  sb.auth.onAuthStateChange((event, session) => {
    setTimeout(() => {
      if (event === "PASSWORD_RECOVERY") { A.user = session && session.user; A.phase = "recovery"; cleanAuthParams(); renderGate(); return; }
      if (event === "SIGNED_OUT") { A.user = null; A.phase = "signed-out"; renderGate(); return; }
      if ((event === "INITIAL_SESSION" || event === "SIGNED_IN") && session) {
        cleanAuthParams();
        if (A.phase === "recovery") return;
        if (A.user && A.user.id === session.user.id && A.phase !== "checking" && A.phase !== "signed-out") { A.user = session.user; return; }
        A.user = session.user; A.g = {...A.g, busy:false, err:"", ok:"", mode:"password"}; routeAfterAuth(); return;
      }
      if (event === "USER_UPDATED" && session) { A.user = session.user; sb.rpc("sync_my_email").then(() => {}, () => {}); if (S.view === "settings") render({skipModalForms:true}); return; }
      if (event === "INITIAL_SESSION" && !session) { cleanAuthParams(); A.phase = "signed-out"; renderGate(); }
    }, 0);
  });
}
async function gateSubmit(id) {
  const g = A.g, vals = {};
  ["gEmail","gPass","gPass2","gName","otpCode","wsName"].forEach(k => { const el = document.getElementById(k); if (el) vals[k] = el.value; });
  const wsImportEl = document.getElementById("wsImport"); const wsImport = !!(wsImportEl && wsImportEl.checked);
  const val = x => vals[x] || "";
  gateSet({busy:true, err:"", ok:""});
  try {
    if (id === "signinForm") {
      g.email = val("gEmail").trim();
      const {error} = await sb.auth.signInWithPassword({email:g.email, password:val("gPass")}); if (error) throw error;
    } else if (id === "signupForm") {
      g.email = val("gEmail").trim();
      const {data, error} = await sb.auth.signUp({email:g.email, password:val("gPass"), options:{data:{full_name:val("gName").trim()}, emailRedirectTo:redirectURL()}});
      if (error) throw error;
      if (data.user && data.user.identities && data.user.identities.length === 0) throw new Error("User already registered");
      if (!data.session) return gateSet({busy:false, tab:"signin", ok:"Account created. Check " + g.email + " for a confirmation link, then sign in here."});
    } else if (id === "magicForm" || id === "resend") {
      if (id === "magicForm") g.email = val("gEmail").trim();
      const email = id === "resend" ? g.otpEmail : g.email;
      const {error} = await sb.auth.signInWithOtp({email, options:{emailRedirectTo:redirectURL(), shouldCreateUser:true}}); if (error) throw error;
      return gateSet({busy:false, mode:"otp-sent", otpEmail:email, ok:id === "resend" ? (CFG.emailCodes ? "New code sent." : "New link sent.") : ""});
    } else if (id === "otpForm") {
      const {error} = await sb.auth.verifyOtp({email:g.otpEmail, token:val("otpCode").replace(/\s/g, ""), type:"email"}); if (error) throw error;
    } else if (id === "forgotForm") {
      g.email = val("gEmail").trim();
      const {error} = await sb.auth.resetPasswordForEmail(g.email, {redirectTo:redirectURL()}); if (error) throw error;
      return gateSet({busy:false, ok:"If " + g.email + " has an account, a reset link is on its way."});
    } else if (id === "recoveryForm") {
      if (val("gPass") !== val("gPass2")) throw new Error("The two passwords don't match.");
      const {error} = await sb.auth.updateUser({password:val("gPass")}); if (error) throw error;
      A.g.busy = false; A.phase = "loading"; toast("Password updated"); return routeAfterAuth();
    } else if (id === "createWsForm") {
      const name = val("wsName").trim(), imp = wsImport;
      const {data:ws, error} = await sb.rpc("create_workspace", {p_name:name}); if (error) throw error;
      if (imp) {
        const rows = legacyRecords().map(r => cleanRec(r)).map(r => ({workspace_id:ws, id:r.id, kind:r.kind, data:r}));
        for (let i = 0; i < rows.length; i += 200) { const {error:e2} = await sb.from("records").upsert(rows.slice(i, i + 200)); if (e2) throw e2; }
        lsSet("cedi-ex-off-" + ws, "1");
      }
      await loadWorkspaces(); A.g.busy = false; toast(name + " is ready"); openWorkspace(ws); return;
    }
    A.g.busy = false;
  } catch (e) { gateSet({busy:false, err:friendlyAuthError(e)}); }
}
async function gateAction(a, el) {
  if (a === "g-tab") return gateSet({tab:el.dataset.v, mode:"password", err:"", ok:""});
  if (a === "g-mode") return gateSet({mode:el.dataset.v, err:"", ok:""});
  if (a === "g-resend") return gateSubmit("resend");
  if (a === "g-google") {
    gateSet({busy:true, err:""});
    const {error} = await sb.auth.signInWithOAuth({provider:"google", options:{redirectTo:redirectURL()}});
    if (error) gateSet({busy:false, err:friendlyAuthError(error)});
    return;
  }
  if (a === "g-accept") {
    gateSet({busy:true, err:""});
    const {data:ws, error} = await sb.rpc("accept_invite", {p_token:A.pendingInvite});
    lsDel("cedi-pending-invite"); A.pendingInvite = null;
    if (error) { A.inviteInfo = null; A.g.busy = false; A.g.err = error.message; return routeAfterAuth(); }
    const name = A.inviteInfo.workspace_name; A.inviteInfo = null; A.g.busy = false;
    await loadWorkspaces(); toast("You've joined " + name); openWorkspace(ws); return;
  }
  if (a === "g-decline") { lsDel("cedi-pending-invite"); A.pendingInvite = null; A.inviteInfo = null; return routeAfterAuth(); }
}
async function signOut(scope) {
  if (A.channel) { sb.removeChannel(A.channel); A.channel = null; }
  try { Object.keys(localStorage).filter(k => /^cedi-(cache|wslist|outbox)/.test(k)).forEach(k => localStorage.removeItem(k)); } catch {}
  outbox = []; S.records = {}; A.ws = null; A.role = null; A.members = []; A.invites = []; A.workspaces = [];
  A.g = {tab:"signin", mode:"password", busy:false, ok:"", err:"", otpEmail:"", email:A.user?.email || ""};
  await sb.auth.signOut({scope:scope === "global" ? "global" : "local"}).catch(() => {});
  if (A.user) lsDel("cedi-myprof-" + A.user.id);
  A.profiles = {}; S.setConfirm = null; S.setMsg = null;
  A.user = null; A.phase = "signed-out"; renderGate();
}

/* ---------- routing & boot ---------- */
function parseHash() {
  let h = location.hash.slice(1);
  if (h === "business") h = "settings-business";
  if (h.startsWith("settings")) { const t = h.slice(9); if (t) S.setTab = t; h = "settings"; }
  S.view = VIEWS.some(v => v[0] === h) ? h : "dashboard";
}
function route() { parseHash(); S.setConfirm = null; S.setMsg = null; S.pendingImport = null; S.modal = S.modal && S.modal.type === "invoiceView" ? S.modal : null; render(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", route);
(() => {   // remember an invite link, then tidy the address bar
  const u = new URL(location.href), tok = u.searchParams.get("invite");
  if (tok && /^[a-f0-9]{32,80}$/i.test(tok)) lsSet("cedi-pending-invite", tok);
  if (tok) { u.searchParams.delete("invite"); history.replaceState(null, "", u.pathname + (u.searchParams.toString() ? "?" + u.searchParams : "") + u.hash); }
})();
parseHash();
if (CLOUD) { renderGate(); initAuth(); }
else { load(); render(); }
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
