<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Cedi Ledger</title>
<meta name="description" content="Invoices, receipts, expenses and budgets in one place.">
<meta name="theme-color" content="#f4c4d0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#2a2523" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Ledger">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&family=DM+Mono:wght@400;500&display=swap">
<script src="jspdf.umd.min.js"></script>
<style>
/* Layout: soft pastel ledger — left rail on desktop, bottom tab bar on phones; tinted KPI tiles, donut charts, paper-style documents. */
:root{
  --bg:#fbf6f4; --surface:#ffffff; --sunken:#f5ede9; --ink:#3d3830; --muted:#7c7369; --line:#eee1dc;
  --pink:#f4c4d0; --pink-soft:#fbe6ec; --pink-deep:#b85870;
  --olive:#c5cf9f; --olive-soft:#eef1df; --olive-deep:#5f6c33;
  --lav:#d8cdef; --lav-soft:#f1ecfa; --peach:#f8d3b8; --mint:#c4e3d3; --butter:#f4e4a6; --butter-soft:#fbf4d9;
  --sky:#c7dcef; --clay:#e9b9aa; --sage:#bfccb4;
  --btn:#f4c4d0; --btn-ink:#3d3830; --btn-hover:#efb2c2;
  --good:#5f6c33; --warn:#9a6b12; --bad:#b24a5c;
  --paper:#fffdfc; --paper-ink:#3d3830; --paper-muted:#857b70; --paper-line:#efe4df;
  --shadow:0 1px 2px rgba(61,56,48,.05),0 10px 30px rgba(61,56,48,.06);
  --f-display:"Young Serif",Georgia,"Times New Roman",serif;
  --f-body:"Nunito Sans","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"DM Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#1e1b1a; --surface:#282422; --sunken:#322d2a; --ink:#f2ebe6; --muted:#b2a79d; --line:#3b3532;
  --pink:#e7b3c0; --pink-soft:#43303a; --pink-deep:#f0a3b6;
  --olive:#b8c38f; --olive-soft:#33382a; --olive-deep:#c9d59c;
  --lav:#c9bde6; --lav-soft:#352f45; --peach:#ecc2a5; --mint:#afd4c1; --butter:#e6d595; --butter-soft:#3b3524;
  --sky:#b3cbe2; --clay:#dba696; --sage:#aebda3;
  --btn:#e7b3c0; --btn-ink:#2a2220; --btn-hover:#efc3ce;
  --good:#c9d59c; --warn:#e6c66b; --bad:#f0a3b6;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.25);
  color-scheme:dark}}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent;
  padding-top:env(safe-area-inset-top,0px)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);font-weight:400;margin:0;text-wrap:balance}
:focus-visible{outline:2px solid var(--pink-deep);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.rail{position:sticky;top:0;height:100vh;padding:24px 14px;background:var(--surface);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:24px}
.brand{display:flex;align-items:center;gap:11px;padding:0 8px}
.brand-mark{width:38px;height:38px;border-radius:12px;background:var(--pink);display:grid;place-items:center;overflow:hidden;flex:none}
.brand-mark span{width:24px;height:24px;border-radius:50%;background:var(--olive);display:grid;place-items:center;font-weight:800;font-size:14px;color:#3d3830}
.brand-mark img{width:100%;height:100%;object-fit:contain;background:var(--surface)}
.brand b{font-family:var(--f-display);font-weight:400;font-size:19px;display:block;line-height:1.15}
.brand small{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:12px;color:var(--muted);text-decoration:none;font-weight:600}
.nav a:hover{background:var(--sunken);color:var(--ink)}
.nav a[aria-current="page"]{background:var(--pink-soft);color:var(--ink)}
.nav a[aria-current="page"] svg{color:var(--pink-deep)}
.nav svg{width:19px;height:19px;flex:none}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:12px;background:var(--butter);color:#3d3830;border-radius:8px;padding:0 7px}
.rail-foot{margin-top:auto;font-size:12px;color:var(--muted);padding:0 8px}

main{min-width:0;padding-block:26px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1160px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:14px}
.head h1{font-size:32px;line-height:1.1}
.head p{margin:4px 0 0;color:var(--muted)}
.head-actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.head-actions input[type=month]{width:auto;min-width:0;max-width:190px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:9px 15px;border-radius:12px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap;min-height:40px}
.btn:hover{background:var(--sunken)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.primary:hover{background:var(--btn-hover)}
.btn.olive{background:var(--olive);color:#3d3830;border-color:var(--olive)}
.btn.danger{color:var(--bad);border-color:var(--pink-soft)}
.btn.danger.solid{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 11px;font-size:13px;min-height:34px}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.45;cursor:default}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 22px;min-width:0}
.panel h2{font-size:19px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.panel-head .sub{color:var(--muted);font-size:13px}
a.sub{color:var(--pink-deep);font-weight:700;text-decoration:none}
.grid-2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px}
.grid-2e{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}

.banner{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;padding:13px 18px;border-radius:16px;background:var(--butter-soft);border:1px dashed var(--butter);font-size:14px}
.banner.lav{background:var(--lav-soft);border-color:var(--lav)}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{padding:16px 18px;border-radius:18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi.t1{background:var(--olive-soft)} .kpi.t2{background:var(--pink-soft)} .kpi.t3{background:var(--lav-soft)} .kpi.t4{background:var(--butter-soft)}
.kpi .label{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800}
.kpi .val{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:23px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .hint{font-size:13px;color:var(--muted)}
.up{color:var(--good)} .down{color:var(--bad)}

/* Donut */
.donut{display:grid;grid-template-columns:170px minmax(0,1fr);gap:20px;align-items:center}
.donut svg{width:100%;max-width:170px;height:auto;display:block}
.donut-legend{display:flex;flex-direction:column;gap:7px;font-size:14px;min-width:0}
.donut-legend div{display:grid;grid-template-columns:12px minmax(0,1fr) auto auto;gap:9px;align-items:center}
.donut-legend i{width:12px;height:12px;border-radius:4px}
.donut-legend span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.donut-legend .pct{color:var(--muted);font-family:var(--f-mono);font-size:12px;min-width:34px;text-align:right}
.donut-legend .v{font-family:var(--f-mono);font-size:13px;text-align:right}

/* Bars */
.bars{display:flex;flex-direction:column;gap:14px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:5px 12px;font-size:14px}
.bar-row .amt{font-family:var(--f-mono);font-size:13px;color:var(--muted)}
.bar-row .amt b{color:var(--ink);font-weight:500}
.track{grid-column:1/-1;height:10px;background:var(--sunken);border-radius:8px;position:relative;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;border-radius:8px;background:var(--olive)}
.fill.warn{background:var(--butter)} .fill.over{background:var(--pink-deep)}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px}

/* Lists & tables */
.list{display:flex;flex-direction:column}
.li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer}
.li:first-child{border-top:0}
.li .t{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .s{font-size:13px;color:var(--muted)}
.ico{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--sunken);color:var(--muted)}
.ico.in{background:var(--olive-soft);color:var(--olive-deep)} .ico.out{background:var(--pink-soft);color:var(--pink-deep)}
.ico svg{width:17px;height:17px}
.table-wrap{overflow-x:auto;margin:0 -22px;padding:0 22px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:800;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--sunken)}
td.r,th.r{text-align:right}
td .muted,.muted{color:var(--muted);font-size:13px}
.pill{display:inline-flex;align-items:center;gap:5px;padding:2px 10px;border-radius:999px;font-size:12px;font-weight:800;white-space:nowrap;color:#3d3830}
.pill.draft{background:var(--sunken);color:var(--muted)}
.pill.sent{background:var(--sky)}
.pill.paid{background:var(--olive)}
.pill.overdue{background:var(--pink)}
.tag{display:inline-block;padding:1px 9px;border-radius:8px;font-size:12px;white-space:nowrap;color:#3d3830;font-weight:600}

.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.chips{display:flex;gap:4px;flex-wrap:wrap;background:var(--sunken);padding:4px;border-radius:14px}
.chip{border:0;background:transparent;padding:6px 12px;border-radius:10px;cursor:pointer;font-size:13px;font-weight:700;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.lbl{font-size:12px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=email],input[type=tel],input[type=search],input[type=month],select,textarea{
  width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 12px;min-width:0;font-size:16px;min-height:42px}
textarea{resize:vertical;min-height:70px}
input:focus,select:focus,textarea:focus{outline:3px solid var(--pink-soft);border-color:var(--pink-deep)}
.toolbar input[type=search]{max-width:240px}
.toolbar select,.toolbar input[type=month]{width:auto}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.form-grid .full{grid-column:1/-1}
.items{display:flex;flex-direction:column;gap:8px}
.item-row{display:grid;grid-template-columns:minmax(0,1fr) 72px 120px 110px 40px;gap:8px;align-items:center}
.item-row .line-total{font-family:var(--f-mono);text-align:right;font-size:14px}
.totals{display:grid;grid-template-columns:auto auto;justify-content:end;gap:4px 24px;font-size:14px;margin-top:6px}
.totals .num{text-align:right}
.totals .grand{font-weight:800;font-size:17px}
.empty{padding:28px 10px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-weight:400;font-size:18px;margin-bottom:4px}
.foot-total{display:flex;justify-content:space-between;padding-top:12px;font-weight:700;border-top:1px solid var(--line);margin-top:6px}

.logo-box{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:14px;border:1px dashed var(--line);border-radius:16px;background:var(--sunken)}
.logo-box .preview{width:120px;height:64px;border-radius:10px;background:var(--paper);display:grid;place-items:center;overflow:hidden;color:var(--paper-muted);font-size:12px;border:1px solid var(--paper-line)}
.logo-box .preview img{max-width:100%;max-height:100%;object-fit:contain}
.file-btn{position:relative;overflow:hidden}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}

/* Overlay */
.overlay{position:fixed;inset:0;background:rgba(40,32,30,.42);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;z-index:50;
  padding:calc(20px + env(safe-area-inset-top,0px)) max(10px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px))}
.modal{background:var(--surface);border-radius:22px;width:100%;max-width:780px;box-shadow:0 20px 60px rgba(0,0,0,.25);display:flex;flex-direction:column}
.modal.narrow{max-width:520px}
.modal-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal-head h2{font-size:21px}
.modal-body{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.modal-foot{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:14px 20px;border-top:1px solid var(--line)}
.modal-foot .left{margin-right:auto}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 14px;background:var(--pink-soft);border-radius:12px;font-size:14px}

/* Paper document */
.paper{position:relative;background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:14px;padding:30px;font-size:14px;overflow:hidden}
.paper .band{position:absolute;inset:0 0 auto 0;height:8px;background:linear-gradient(90deg,var(--pink) 0 50%,var(--olive) 50% 100%)}
.paper .p-top{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap}
.paper .p-logo{max-width:150px;max-height:64px;object-fit:contain;display:block;margin-bottom:8px}
.paper h3{font-size:28px;letter-spacing:.03em}
.paper .p-muted{color:var(--paper-muted)}
.paper .p-meta{display:grid;grid-template-columns:auto auto;gap:2px 14px;font-size:13px;align-content:start}
.paper .p-meta span:nth-child(odd){color:var(--paper-muted)}
.paper table th{color:var(--paper-muted);border-color:var(--paper-line)}
.paper table td{border-color:var(--paper-line)}
.paper .p-sec{margin-top:22px}
.paper .p-amount{font-family:var(--f-mono);font-size:32px}
.paper .stamp{position:absolute;right:28px;width:190px;pointer-events:none;opacity:.92}
.paper .stamp.inv{top:110px;width:160px}
.paper .stamp.rct{top:120px}
.paper .lbl{color:var(--paper-muted)}
.paper .table-x{overflow-x:auto}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:700;font-size:14px;z-index:80;box-shadow:var(--shadow);max-width:calc(100% - 32px);text-align:center}

.tabbar{display:none}
@media (max-width:960px){
  .kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid-2,.grid-2e{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  main{padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
  .head h1{font-size:27px}
  .tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);
    padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;padding:5px 0;border-radius:12px}
  .tabbar a[aria-current="page"]{color:var(--ink);background:var(--pink-soft)}
  .tabbar a[aria-current="page"] svg{color:var(--pink-deep)}
  .tabbar svg{width:21px;height:21px}
  .form-grid{grid-template-columns:minmax(0,1fr)}
  .item-row{grid-template-columns:minmax(0,1fr) 58px 92px 40px}
  .item-row .line-total{display:none}
  .paper{padding:22px 18px}
  .paper .stamp{width:130px;right:14px}
  .paper .stamp.inv{width:110px;top:96px}
  .kpi .val{font-size:19px}
  .toolbar input[type=search]{max-width:none;flex:1 1 100%}
  .donut{grid-template-columns:minmax(0,1fr);justify-items:center}
  .donut-legend{width:100%}
  .head-actions .hide-sm{display:none}
}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .5s ease}}
</style>
</head>
<body>
<div class="app">
  <aside class="rail" aria-label="Main">
    <div class="brand"><div class="brand-mark" id="brandMark"><span>₵</span></div><div><b>Cedi Ledger</b><small id="bizName">Your business</small></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="rail-foot" id="railFoot">Saved on this device</div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="Main"></nav>
<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
(() => {
"use strict";
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const iso = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const today = () => iso(new Date());
const monthKey = d => (typeof d === "string" ? d.slice(0, 7) : d.getFullYear() + "-" + pad(d.getMonth() + 1));
const addDays = (s, n) => { const d = new Date(s + "T12:00:00"); d.setDate(d.getDate() + n); return iso(d); };
const addMonths = (mk, n) => { const [y, m] = mk.split("-").map(Number); return monthKey(new Date(y, m - 1 + n, 1)); };
const monthLabel = (mk, long) => new Date(mk + "-15T12:00:00").toLocaleDateString("en-GB", long ? {month:"long", year:"numeric"} : {month:"short"});
const fmtDate = s => s ? new Date(s + "T12:00:00").toLocaleDateString("en-GB", {day:"numeric", month:"short", year:"numeric"}) : "—";
const rid = p => p + "-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const num = v => { const n = parseFloat(v); return isFinite(n) ? n : 0; };
const round2 = n => Math.round(n * 100) / 100;

const CATEGORIES = ["Rent & utilities","Equipment","Transport","Software","Supplies","Meals","Marketing","Salaries & fees","Other"];
const CAT_COLOR = {"Rent & utilities":"--pink","Equipment":"--lav","Transport":"--peach","Software":"--sky","Supplies":"--butter","Meals":"--clay","Marketing":"--mint","Salaries & fees":"--olive","Other":"--sage"};
const SERIES = ["--pink","--olive","--lav","--peach","--mint","--sky","--butter","--clay","--sage"];

function money(n, cur) {

function invoiceTotals(inv) {
  const sub = (inv.items || []).reduce((s, it) => s + num(it.qty) * num(it.price), 0);
  const disc = Math.min(num(inv.discount), sub), tax = (sub - disc) * num(inv.taxRate) / 100;
  return {sub:round2(sub), disc:round2(disc), tax:round2(tax), total:round2(sub - disc + tax)};
}

/* ---------- paid stamp (canvas → PNG, used on screen and in PDFs) ---------- */
const stampCache = {};
function stampPNG(date, label) {
  const key = date + label;
  if (stampCache[key]) return stampCache[key];
  const W = 520, H = 300, c = document.createElement("canvas"); c.width = W; c.height = H;
  const g = c.getContext("2d"), col = "#c0566f";
  g.translate(W / 2, H / 2); g.rotate(-0.16);
  g.strokeStyle = col; g.fillStyle = col; g.lineJoin = "round";
  const rr = (w, h, r) => { g.beginPath(); g.moveTo(-w/2 + r, -h/2); g.arcTo(w/2, -h/2, w/2, h/2, r); g.arcTo(w/2, h/2, -w/2, h/2, r);
    g.arcTo(-w/2, h/2, -w/2, -h/2, r); g.arcTo(-w/2, -h/2, w/2, -h/2, r); g.closePath(); g.stroke(); };
  g.lineWidth = 9; rr(440, 210, 26); g.lineWidth = 3; rr(408, 178, 18);
  g.textAlign = "center"; g.textBaseline = "middle";
  g.font = "900 100px 'Nunito Sans', 'Arial Black', Arial, sans-serif"; g.fillText(label, 0, -14);
  g.font = "800 26px 'DM Mono', 'Courier New', monospace"; g.fillText(fmtDate(date).toUpperCase(), 0, 58);
  // ink texture: knock out small specks
  g.setTransform(1, 0, 0, 1, 0, 0); g.globalCompositeOperation = "destination-out";
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 900; i++) { g.globalAlpha = .25 + rnd() * .6; g.beginPath(); g.arc(rnd() * W, rnd() * H, rnd() * 2.4, 0, 7); g.fill(); }
  return (stampCache[key] = c.toDataURL("image/png"));
}

/* ---------- logo ---------- */
function readLogo(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(file.type)) return reject(new Error("Choose an image file (PNG or JPG)."));
    const fr = new FileReader();
    fr.onerror = () => reject(new Error("Couldn't read that file."));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error("That image format isn't supported. Try PNG or JPG."));
      img.onload = () => {
        const max = 420, k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL("image/png"));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- sharing & files ---------- */
async function shareFile(blob, filename, title) {
  const file = new File([blob], filename, {type:blob.type || "application/octet-stream"});
  if (navigator.canShare && navigator.canShare({files:[file]})) {
    try { await navigator.share({files:[file], title}); return; }
    catch (e) { if (e && e.name === "AbortError") return; }
  }
  const url = URL.createObjectURL(blob), a = document.createElement("a");
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000); toast("Saved " + filename);
}
async function shareText(text, title) {
  if (navigator.share) { try { await navigator.share({title, text}); return; } catch (e) { if (e && e.name === "AbortError") return; } }
  copyText(text);
}
async function copyText(text) {
  try { await navigator.clipboard.writeText(text); toast("Copied. Paste it into WhatsApp, email or SMS."); }
  catch {
    const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); toast("Copied"); } catch { toast("Couldn't copy automatically."); }
    ta.remove();
  }
}

/* ---------- computations ---------- */
function monthTotals(mk) {
  return {inc:round2(all("receipt").filter(r => monthKey(r.date) === mk).reduce((s, r) => s + num(r.amount), 0)),
          out:round2(all("expense").filter(r => monthKey(r.date) === mk).reduce((s, r) => s + num(r.amount), 0))};
}
function spendByCat(mk) { const m = {}; all("expense").filter(r => monthKey(r.date) === mk).forEach(r => m[r.category] = (m[r.category] || 0) + num(r.amount)); return m; }
function nextNumber(kind) {
  const prefix = kind === "invoice" ? (settings().prefix || "INV") : "RCT", y = new Date().getFullYear();
  const re = new RegExp("^" + prefix + "-" + y + "-(\\d+)$"); let max = 0;
  Object.values(S.records).filter(r => r.kind === kind).forEach(r => { const m = re.exec(r.number || ""); if (m) max = Math.max(max, +m[1]); });
  return prefix + "-" + y + "-" + String(max + 1).padStart(3, "0");
}

/* ---------- charts ---------- */
function donut(slices, centerTop, centerBottom, label) {
  slices = slices.filter(s => s.value > 0);
  const total = slices.reduce((s, x) => s + x.value, 0);
  if (!total) return `<div class="empty"><b>Nothing to chart yet</b>Data for this period will appear here.</div>`;
  const R = 80, r = 52, C = 90, gap = slices.length > 1 ? 0.012 : 0;
  let a0 = -Math.PI / 2, paths = "";
  const pt = (rad, a) => [C + rad * Math.cos(a), C + rad * Math.sin(a)];
  slices.forEach(s => {
    const frac = s.value / total, a1 = a0 + frac * Math.PI * 2;
    if (frac >= 0.9999) {
      paths += `<circle cx="${C}" cy="${C}" r="${(R + r) / 2}" fill="none" stroke="var(${s.color})" stroke-width="${R - r}"><title>${esc(s.name)}: ${money(s.value)}</title></circle>`;
    } else {
      const s0 = a0 + gap, s1 = a1 - gap, large = s1 - s0 > Math.PI ? 1 : 0;
      const [x0, y0] = pt(R, s0), [x1, y1] = pt(R, s1), [x2, y2] = pt(r, s1), [x3, y3] = pt(r, s0);
      paths += `<path d="M${x0} ${y0}A${R} ${R} 0 ${large} 1 ${x1} ${y1}L${x2} ${y2}A${r} ${r} 0 ${large} 0 ${x3} ${y3}Z" fill="var(${s.color})"><title>${esc(s.name)}: ${money(s.value)}</title></path>`;
    }
    a0 = a1;
  });
  const svg = `<svg viewBox="0 0 180 180" role="img" aria-label="${esc(label)}">${paths}
    <text x="90" y="86" text-anchor="middle" font-size="16" font-family="var(--f-mono)" fill="var(--ink)">${esc(centerTop)}</text>
    <text x="90" y="105" text-anchor="middle" font-size="10.5" font-weight="700" fill="var(--muted)" letter-spacing=".06em">${esc(centerBottom)}</text></svg>`;
  const legend = slices.sort((a, b) => b.value - a.value).map(s => `<div><i style="background:var(${s.color})"></i><span>${esc(s.name)}</span><b class="pct">${Math.round(s.value / total * 100)}%</b><span class="v">${money(s.value)}</span></div>`).join("");
  return `<div class="donut">${svg}<div class="donut-legend">${legend}</div></div>`;
}
function shortMoney(v) { return v >= 1e6 ? (v / 1e6).toFixed(1).replace(/\.0$/, "") + "M" : v >= 1000 ? (v / 1000).toFixed(1).replace(/\.0$/, "") + "k" : String(Math.round(v)); }
function niceStep(x) { const p = Math.pow(10, Math.floor(Math.log10(x || 1))), f = x / p; return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p; }
function cashChart(months) {
  const vals = months.map(monthTotals), max = Math.max(1, ...vals.map(v => Math.max(v.inc, v.out)));
  const step = niceStep(max / 4), top = Math.ceil(max / step) * step;
  const W = 620, H = 240, L = 54, R = 8, T = 12, B = 30, iw = W - L - R, ih = H - T - B, gw = iw / months.length, bw = Math.min(28, gw / 3.2);
  const y = v => T + ih - v / top * ih;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Money in and out, last six months">`;
  for (let v = 0; v <= top + 1e-6; v += step) {
    s += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" ${v ? 'stroke-dasharray="3 5"' : ""}/>`;
    s += `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--f-mono)">${shortMoney(v)}</text>`;
  }
  months.forEach((mk, i) => {
    const cx = L + gw * i + gw / 2, v = vals[i], on = mk === S.dashMonth;
    s += `<rect x="${cx - bw - 2}" y="${y(v.inc)}" width="${bw}" height="${Math.max(0, T + ih - y(v.inc))}" rx="6" fill="var(--olive)" opacity="${on ? 1 : .6}"><title>${monthLabel(mk)} in: ${money(v.inc)}</title></rect>`;
    s += `<rect x="${cx + 2}" y="${y(v.out)}" width="${bw}" height="${Math.max(0, T + ih - y(v.out))}" rx="6" fill="var(--pink)" opacity="${on ? 1 : .6}"><title>${monthLabel(mk)} out: ${money(v.out)}</title></rect>`;
    s += `<text x="${cx}" y="${H - 9}" text-anchor="middle" font-size="12" fill="${on ? "var(--ink)" : "var(--muted)"}" font-weight="${on ? 800 : 400}">${monthLabel(mk)}</text>`;
  });
  return s + "</svg>";
}
function budgetBars(mk, limit) {
  const st = settings(), spend = spendByCat(mk);
  let cats = CATEGORIES.filter(c => num(st.budgets[c]) > 0 || spend[c]);
  cats.sort((a, b) => ((spend[b] || 0) / (num(st.budgets[b]) || 1)) - ((spend[a] || 0) / (num(st.budgets[a]) || 1)));
  if (limit) cats = cats.slice(0, limit);
  if (!cats.length) return `<div class="empty"><b>No budgets yet</b>Set a monthly limit per category to track it here.<br><br><a class="btn sm" href="#budgets">Set budgets</a></div>`;
  return `<div class="bars">${cats.map(c => {
    const b = num(st.budgets[c]), sp = spend[c] || 0, pct = b ? sp / b * 100 : 100, cls = !b ? "" : pct > 100 ? "over" : pct > 85 ? "warn" : "";
    return `<div class="bar-row"><span>${esc(c)}${b && pct > 100 ? ' <span class="down" style="font-size:12px;font-weight:800">OVER</span>' : ""}</span><span class="amt"><b>${money(sp)}</b>${b ? " / " + shortMoney(b) : " · no limit"}</span>
      <div class="track" role="progressbar" aria-label="${esc(c)}" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><div class="fill ${cls}" style="width:${Math.min(100, pct)}%"></div></div></div>`;
  }).join("")}</div>`;
}

function vDashboard() {
  const mk = S.dashMonth, st = settings(), cur = monthTotals(mk), prev = monthTotals(addMonths(mk, -1)), net = cur.inc - cur.out;
  const open = all("invoice").filter(i => ["sent","overdue"].includes(invStatus(i))), overdue = open.filter(i => invStatus(i) === "overdue");
  const outstanding = open.reduce((s, i) => s + invoiceTotals(i).total, 0);
  const delta = (a, b) => b ? Math.round((a - b) / b * 100) : null, dIn = delta(cur.inc, prev.inc), dOut = delta(cur.out, prev.out);
  const months = []; for (let i = 5; i >= 0; i--) months.push(addMonths(mk, -i));
  const spend = spendByCat(mk);
  const inc6 = {}; all("receipt").filter(r => months.includes(monthKey(r.date))).forEach(r => inc6[r.payer] = (inc6[r.payer] || 0) + num(r.amount));
  const inc6Total = Object.values(inc6).reduce((a, b) => a + b, 0);
  return `
  <div class="head"><div><h1>Hello${st.business.name ? ", " + esc(st.business.name.split(" ")[0]) : ""}</h1><p>Your money at a glance · ${monthLabel(mk, true)}</p></div>
    <div class="head-actions">
      <button class="btn sm ghost" data-action="dash-month" data-dir="-1" aria-label="Previous month">‹</button>
      <input type="month" id="dashMonth" value="${mk}" aria-label="Month">
      <button class="btn sm ghost" data-action="dash-month" data-dir="1" aria-label="Next month">›</button>
      <button class="btn olive hide-sm" data-action="new-expense">${I.plus}Expense</button>
      <button class="btn primary" data-action="new-invoice">${I.plus}Invoice</button>
    </div></div>
  <section class="kpis" aria-label="This month">
    <div class="kpi t1"><span class="label">Money in</span><span class="val">${money(cur.inc)}</span><span class="hint">${dIn === null ? "Payments received" : `<span class="${dIn >= 0 ? "up" : "down"}">${dIn >= 0 ? "▲" : "▼"} ${Math.abs(dIn)}%</span> vs ${monthLabel(addMonths(mk, -1))}`}</span></div>
    <div class="kpi t2"><span class="label">Money out</span><span class="val">${money(cur.out)}</span><span class="hint">${dOut === null ? "Expenses" : `<span class="${dOut <= 0 ? "up" : "down"}">${dOut >= 0 ? "▲" : "▼"} ${Math.abs(dOut)}%</span> vs ${monthLabel(addMonths(mk, -1))}`}</span></div>
    <div class="kpi t3"><span class="label">Net</span><span class="val ${net >= 0 ? "up" : "down"}">${net < 0 ? "−" : ""}${money(Math.abs(net))}</span><span class="hint">${cur.inc ? Math.round(net / cur.inc * 100) + "% margin" : "In minus out"}</span></div>
    <div class="kpi t4"><span class="label">Unpaid invoices</span><span class="val">${money(outstanding)}</span><span class="hint">${open.length} open${overdue.length ? ` · <span class="down">${overdue.length} overdue</span>` : ""}</span></div>
  </section>
  <div class="grid-2e">
    <section class="panel"><div class="panel-head"><h2>Where the money went</h2><span class="sub">${monthLabel(mk, true)}</span></div>
      ${donut(Object.entries(spend).map(([name, value]) => ({name, value, color:CAT_COLOR[name] || "--sage"})), shortMoney(cur.out), "SPENT", "Spending by category")}</section>
    <section class="panel"><div class="panel-head"><h2>Who paid you</h2><span class="sub">Last 6 months</span></div>
      ${donut(Object.entries(inc6).map(([name, value], i) => ({name, value, color:SERIES[i % SERIES.length]})), shortMoney(inc6Total), "RECEIVED", "Income by client")}</section>
  </div>
  <div class="grid-2">
    <section class="panel"><div class="panel-head"><h2>Cash flow</h2><div class="legend"><span><i style="background:var(--olive)"></i>In</span><span><i style="background:var(--pink)"></i>Out</span></div></div>
      <div class="chart">${cashChart(months)}</div></section>
    <section class="panel"><div class="panel-head"><h2>Budgets</h2><a class="sub" href="#budgets">Edit</a></div>${budgetBars(mk, 5)}</section>
  </div>
  <div class="grid-2e">
    <section class="panel"><div class="panel-head"><h2>Needs attention</h2><a class="sub" href="#invoices">All invoices</a></div>${attentionList(open)}</section>
    <section class="panel"><div class="panel-head"><h2>Recent activity</h2></div>${recentList()}</section>
  </div>`;
}
function attentionList(open) {
  if (!open.length) return `<div class="empty"><b>All caught up</b>No unpaid invoices right now.</div>`;
  return `<div class="list">${[...open].sort((a, b) => (a.dueDate || "").localeCompare(b.dueDate || "")).slice(0, 5).map(i => {
    const s = invStatus(i), days = Math.round((new Date(i.dueDate + "T12:00:00") - new Date(today() + "T12:00:00")) / 864e5);
    return `<div class="li" data-action="view-invoice" data-id="${i.id}"><span class="ico ${s === "overdue" ? "out" : ""}">${I.invoices}</span>
      <div style="min-width:0"><div class="t">${esc(i.client?.name || "No client")}</div><div class="s">${esc(i.number)} · ${s === "overdue" ? `<span class="down">${-days} day${days === -1 ? "" : "s"} overdue</span>` : days === 0 ? "Due today" : `Due in ${days} day${days === 1 ? "" : "s"}`}</div></div>
      <span class="num">${money(invoiceTotals(i).total)}</span></div>`; }).join("")}</div>`;
}
function recentList() {
  const items = [...all("receipt").map(r => ({t:"in", date:r.date, title:r.payer, sub:r.method, amt:num(r.amount), id:r.id})),
    ...all("expense").map(e => ({t:"out", date:e.date, title:e.vendor, sub:e.category, amt:num(e.amount), id:e.id}))].sort((a, b) => b.date.localeCompare(a.date)).slice(0, 6);
  if (!items.length) return `<div class="empty"><b>Nothing yet</b>Payments and expenses show up here.</div>`;
  return `<div class="list">${items.map(x => `<div class="li" data-action="${x.t === "in" ? "view-receipt" : "edit-expense"}" data-id="${x.id}">
    <span class="ico ${x.t}">${x.t === "in" ? I.arrowIn : I.arrowOut}</span><div style="min-width:0"><div class="t">${esc(x.title)}</div><div class="s">${fmtDate(x.date)} · ${esc(x.sub)}</div></div>
    <span class="num ${x.t === "in" ? "up" : ""}">${x.t === "in" ? "+" : "−"}${money(x.amt)}</span></div>`).join("")}</div>`;
}

/* ---------- Invoices ---------- */
function vInvoices() {
  const invs = all("invoice"), q = S.invSearch.toLowerCase();
  const list = invs.filter(i => (S.invFilter === "all" || invStatus(i) === S.invFilter) && (!q || (i.number + " " + (i.client?.name || "")).toLowerCase().includes(q)))
    .sort((a, b) => (b.issueDate || "").localeCompare(a.issueDate || ""));
  const sumOf = s => invs.filter(i => invStatus(i) === s).reduce((t, i) => t + invoiceTotals(i).total, 0);
  const chip = (k, l) => `<button class="chip" data-action="inv-filter" data-v="${k}" aria-pressed="${S.invFilter === k}">${l}</button>`;
  const statusSlices = [["paid","Paid","--olive"],["sent","Awaiting payment","--sky"],["overdue","Overdue","--pink"],["draft","Draft","--butter"]].map(([k, n, c]) => ({name:n, value:sumOf(k), color:c}));
  const billed = invs.reduce((t, i) => t + invoiceTotals(i).total, 0);
  return `
  <div class="head"><div><h1>Invoices</h1><p>${money(sumOf("sent") + sumOf("overdue"))} awaiting payment${sumOf("overdue") ? ` · <span class="down">${money(sumOf("overdue"))} overdue</span>` : ""}</p></div>
    <div class="head-actions"><button class="btn primary" data-action="new-invoice">${I.plus}New invoice</button></div></div>
  <div class="grid-2">
    <section class="panel">
      <div class="toolbar"><div class="chips">${chip("all","All")}${chip("draft","Draft")}${chip("sent","Awaiting")}${chip("overdue","Overdue")}${chip("paid","Paid")}</div>
        <input type="search" id="invSearch" placeholder="Search client or number" value="${esc(S.invSearch)}" aria-label="Search invoices"></div>
      ${list.length ? `<div class="table-wrap"><table><thead><tr><th>Invoice</th><th>Client</th><th>Due</th><th>Status</th><th class="r">Amount</th></tr></thead><tbody>
        ${list.map(i => { const s = invStatus(i); return `<tr class="click" data-action="view-invoice" data-id="${i.id}"><td class="mono">${esc(i.number)}</td>
          <td>${esc(i.client?.name || "—")}<div class="muted">Issued ${fmtDate(i.issueDate)}</div></td><td>${fmtDate(i.dueDate)}</td><td><span class="pill ${s}">${statusLabel(s)}</span></td><td class="r num">${money(invoiceTotals(i).total)}</td></tr>`; }).join("")}
      </tbody></table></div>` : `<div class="empty"><b>${invs.length ? "No invoices match" : "No invoices yet"}</b>${invs.length ? "Try another filter or search." : "Create your first invoice to bill a client."}</div>`}
    </section>
    <section class="panel"><div class="panel-head"><h2>By status</h2><span class="sub">All time</span></div>${donut(statusSlices, shortMoney(billed), "BILLED", "Invoice value by status")}</section>
  </div>`;
}

/* ---------- Receipts ---------- */
function vReceipts() {
  const list = all("receipt").sort((a, b) => b.date.localeCompare(a.date)), mk = monthKey(new Date());
  const tm = list.filter(r => monthKey(r.date) === mk).reduce((s, r) => s + num(r.amount), 0);
  return `
  <div class="head"><div><h1>Receipts</h1><p>${money(tm)} received in ${monthLabel(mk, true)}</p></div>
    <div class="head-actions"><button class="btn primary" data-action="new-receipt">${I.plus}Record payment</button></div></div>
  <section class="panel">${list.length ? `<div class="table-wrap"><table><thead><tr><th>Receipt</th><th>Received from</th><th>Date</th><th>Method</th><th class="r">Amount</th></tr></thead><tbody>
    ${list.map(r => `<tr class="click" data-action="view-receipt" data-id="${r.id}"><td class="mono">${esc(r.number)}</td><td>${esc(r.payer)}${r.note ? `<div class="muted">${esc(r.note)}</div>` : ""}</td>
      <td>${fmtDate(r.date)}</td><td><span class="tag" style="background:var(--${r.method === "Mobile Money" ? "butter" : r.method === "Cash" ? "mint" : "lav"})">${esc(r.method)}</span></td><td class="r num">${money(r.amount)}</td></tr>`).join("")}
  </tbody></table></div>` : `<div class="empty"><b>No receipts yet</b>Record a payment, or mark an invoice paid, to issue a receipt with a PAID stamp.</div>`}</section>`;
}

/* ---------- Expenses ---------- */
function vExpenses() {
  const q = S.expSearch.toLowerCase();
  const list = all("expense").filter(e => (!S.expMonth || monthKey(e.date) === S.expMonth) && (!S.expCat || e.category === S.expCat) && (!q || (e.vendor + " " + (e.note || "")).toLowerCase().includes(q)))
    .sort((a, b) => b.date.localeCompare(a.date));
  const total = list.reduce((s, e) => s + num(e.amount), 0), byCat = {};
  list.forEach(e => byCat[e.category] = (byCat[e.category] || 0) + num(e.amount));
  return `
  <div class="head"><div><h1>Expenses</h1><p>${money(total)} across ${list.length} expense${list.length === 1 ? "" : "s"}${S.expMonth ? " in " + monthLabel(S.expMonth, true) : ""}</p></div>
    <div class="head-actions"><button class="btn" data-action="export-csv">${I.file}Export CSV</button><button class="btn primary" data-action="new-expense">${I.plus}Add expense</button></div></div>
  <div class="grid-2">
    <section class="panel">
      <div class="toolbar"><input type="month" id="expMonth" value="${S.expMonth}" aria-label="Month">
        <button class="btn sm ghost" data-action="exp-allmonths">${S.expMonth ? "All months" : "This month"}</button>
        <select id="expCat" aria-label="Category"><option value="">All categories</option>${CATEGORIES.map(c => `<option ${S.expCat === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>
        <input type="search" id="expSearch" placeholder="Search vendor or note" value="${esc(S.expSearch)}" aria-label="Search expenses"></div>
      ${list.length ? `<div class="table-wrap"><table><thead><tr><th>Date</th><th>Vendor</th><th>Category</th><th class="r">Amount</th></tr></thead><tbody>
        ${list.map(e => `<tr class="click" data-action="edit-expense" data-id="${e.id}"><td style="white-space:nowrap">${fmtDate(e.date)}</td><td>${esc(e.vendor)}<div class="muted">${esc(e.method)}${e.note ? " · " + esc(e.note) : ""}</div></td>
          <td><span class="tag" style="background:var(${CAT_COLOR[e.category] || "--sage"})">${esc(e.category)}</span></td><td class="r num">${money(e.amount)}</td></tr>`).join("")}
      </tbody></table></div><div class="foot-total"><span>Total</span><span class="num">${money(total)}</span></div>` : `<div class="empty"><b>No expenses here</b>Add an expense or change the filters.</div>`}
    </section>
    <section class="panel"><div class="panel-head"><h2>By category</h2><span class="sub">${S.expMonth ? monthLabel(S.expMonth, true) : "All months"}</span></div>
      ${donut(Object.entries(byCat).map(([name, value]) => ({name, value, color:CAT_COLOR[name] || "--sage"})), shortMoney(total), "SPENT", "Expenses by category")}</section>
  </div>`;
}

/* ---------- Budgets ---------- */
function vBudgets() {
  const st = settings(), mk = monthKey(new Date()), spend = spendByCat(mk);
  const totalB = CATEGORIES.reduce((s, c) => s + num(st.budgets[c]), 0), totalS = Object.values(spend).reduce((a, b) => a + b, 0);
  return `
  <div class="head"><div><h1>Budgets</h1><p>${monthLabel(mk, true)}: ${money(totalS)} of ${money(totalB)} spent</p></div></div>
  <div class="grid-2e">
    <section class="panel"><div class="panel-head"><h2>Progress this month</h2></div>${budgetBars(mk)}</section>
    <section class="panel"><div class="panel-head"><h2>How your budget is split</h2></div>
      ${donut(CATEGORIES.map(c => ({name:c, value:num(st.budgets[c]), color:CAT_COLOR[c]})), shortMoney(totalB), "PER MONTH", "Budget split by category")}</section>
  </div>
  <section class="panel"><div class="panel-head"><h2>Monthly limits</h2><span class="sub">${st.currency}</span></div>
    <form id="budgetForm"><div class="form-grid" style="grid-template-columns:repeat(auto-fill,minmax(200px,1fr))">
      ${CATEGORIES.map((c, i) => `<div class="field"><label for="b${i}">${esc(c)}</label><input type="number" inputmode="decimal" min="0" step="10" id="b${i}" name="${esc(c)}" value="${num(st.budgets[c]) || ""}" placeholder="No limit"></div>`).join("")}
    </div><div style="margin-top:16px"><button class="btn primary" type="submit">Save budgets</button></div></form></section>`;
}

    <div class="logo-box"><div class="preview">${st.logo ? `<img src="${st.logo}" alt="Your logo">` : "No logo"}</div>

      <div class="field"><label for="bzPhone">Phone</label><input type="tel" id="bzPhone" name="phone" value="${esc(b.phone)}"></div>
      <div class="field full"><label for="bzAddr">Address</label><textarea id="bzAddr" name="address" rows="2">${esc(b.address)}</textarea></div>
      <div class="field"><label for="bzMomo">Mobile Money details</label><input type="text" id="bzMomo" name="momo" value="${esc(b.momo)}" placeholder="Number and account name"></div>
      <div class="field"><label for="bzBank">Bank details</label><input type="text" id="bzBank" name="bank" value="${esc(b.bank)}" placeholder="Bank, account number"></div>
      <div class="field"><label for="bzCur">Currency</label><select id="bzCur" name="currency">${CURRENCIES.map(c => `<option ${st.currency === c ? "selected" : ""}>${c}</option>`).join("")}</select></div>

      <div class="field full"><div><button class="btn primary" type="submit">Save details</button></div></div>
    </form></section>
  <section class="panel"><div class="panel-head"><h2>Backup &amp; restore</h2><span class="sub">${lb ? "Last backup " + fmtDate(lb) : "No backup yet"}</span></div>
    <p class="muted" style="margin:0 0 14px">Your records are stored only on this device. Save a backup file to iCloud Drive or send it to yourself, and restore it on a new phone or browser.</p>
    ${S.pendingImport ? `<div class="confirm" style="margin-bottom:12px"><span>Replace everything on this device with <b>${S.pendingImport.count}</b> records from ${esc(S.pendingImport.name)}?</span>
      <span style="margin-left:auto;display:flex;gap:6px"><button class="btn sm" data-action="cancel-import">Cancel</button><button class="btn sm danger solid" data-action="confirm-import">Replace</button></span></div>` : ""}
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn olive" data-action="export-backup">${I.share}Save backup</button>
      <label class="btn file-btn">Restore from backup<input type="file" id="importInput" accept="application/json,.json"></label></div></section>`;
}

/* ---------- documents ---------- */
function bizBlock(st) {
  const b = st.business;
  return `<div>${st.logo ? `<img class="p-logo" src="${st.logo}" alt="">` : ""}<b style="font-size:16px">${esc(b.name || "Your business")}</b>
    <div class="p-muted" style="white-space:pre-line">${esc([b.address, b.phone, b.email].filter(Boolean).join("\n"))}</div></div>`;
}
function invoiceDoc(inv) {
  const st = settings(), t = invoiceTotals(inv), s = invStatus(inv), b = st.business;
  return `<div class="paper"><div class="band"></div>
    ${s === "paid" ? `<img class="stamp inv" src="${stampPNG(inv.paidDate || today(), "PAID")}" alt="Paid">` : ""}
    <div class="p-top">${bizBlock(st)}<div style="text-align:right"><h3>Invoice</h3><div class="mono">${esc(inv.number)}</div></div></div>
    <div class="p-top p-sec"><div><div class="lbl">Bill to</div><b>${esc(inv.client?.name || "—")}</b>
      <div class="p-muted" style="white-space:pre-line">${esc([inv.client?.address, inv.client?.phone, inv.client?.email].filter(Boolean).join("\n"))}</div></div>
      <div class="p-meta"><span>Issued</span><span>${fmtDate(inv.issueDate)}</span><span>Due</span><span>${fmtDate(inv.dueDate)}</span>${inv.paidDate ? `<span>Paid</span><span>${fmtDate(inv.paidDate)}</span>` : ""}</div></div>
    <div class="p-sec table-x"><table><thead><tr><th>Description</th><th class="r">Qty</th><th class="r">Rate</th><th class="r">Amount</th></tr></thead><tbody>
      ${(inv.items || []).map(it => `<tr><td>${esc(it.desc)}</td><td class="r num">${num(it.qty)}</td><td class="r num">${money(num(it.price))}</td><td class="r num">${money(num(it.qty) * num(it.price))}</td></tr>`).join("")}
    </tbody></table>
    <div class="totals"><span>Subtotal</span><span class="num">${money(t.sub)}</span>${t.disc ? `<span>Discount</span><span class="num">−${money(t.disc)}</span>` : ""}
      ${num(inv.taxRate) ? `<span>Tax (${num(inv.taxRate)}%)</span><span class="num">${money(t.tax)}</span>` : ""}<span class="grand">${s === "paid" ? "Total paid" : "Total due"}</span><span class="num grand">${money(t.total)}</span></div></div>
    ${(b.momo || b.bank) && s !== "paid" ? `<div class="p-sec"><div class="lbl">How to pay</div>${b.momo ? `<div>Mobile Money: ${esc(b.momo)}</div>` : ""}${b.bank ? `<div>Bank: ${esc(b.bank)}</div>` : ""}<div class="p-muted">Please use ${esc(inv.number)} as the reference.</div></div>` : ""}
    ${inv.notes ? `<div class="p-sec p-muted">${esc(inv.notes)}</div>` : ""}</div>`;
}
function receiptDoc(r) {
  const st = settings(), inv = r.invoiceId && data()[r.invoiceId];
  return `<div class="paper"><div class="band"></div><img class="stamp rct" src="${stampPNG(r.date, "PAID")}" alt="Paid">
    <div class="p-top">${bizBlock(st)}<div style="text-align:right"><h3>Receipt</h3><div class="mono">${esc(r.number)}</div></div></div>
    <div class="p-sec"><div class="lbl">Amount received</div><div class="p-amount">${money(r.amount)}</div></div>
    <div class="p-sec p-meta" style="grid-template-columns:auto 1fr;font-size:14px;gap:7px 18px">
      <span>Received from</span><b>${esc(r.payer)}</b><span>Date</span><span>${fmtDate(r.date)}</span><span>Payment method</span><span>${esc(r.method)}</span>
      ${r.reference ? `<span>Transaction ref.</span><span class="mono">${esc(r.reference)}</span>` : ""}${inv ? `<span>For invoice</span><span class="mono">${esc(inv.number)}</span>` : ""}
      ${r.note ? `<span>Note</span><span>${esc(r.note)}</span>` : ""}</div>
    <div class="p-sec p-muted">Thank you for your payment.</div></div>`;
}
const tidy = lines => lines.filter((l, i, a) => l !== "" || (i > 0 && a[i - 1] !== "")).join("\n");
function invoiceShareText(inv) {
  const st = settings(), t = invoiceTotals(inv), b = st.business;
  return tidy([`Invoice ${inv.number} from ${b.name || "us"}`, `To: ${inv.client?.name || ""}`, "", ...(inv.items || []).map(it => `• ${it.desc} — ${num(it.qty)} × ${moneyPlain(num(it.price))}`), "",
    `Total due: ${moneyPlain(t.total)}`, `Due date: ${fmtDate(inv.dueDate)}`, b.momo ? `Mobile Money: ${b.momo}` : "", b.bank ? `Bank: ${b.bank}` : "", `Reference: ${inv.number}`, "", "Thank you!"]);
}
function receiptShareText(r) {
  const inv = r.invoiceId && data()[r.invoiceId];
  return tidy([`✅ PAID — Receipt ${r.number}`, settings().business.name || "", "", `Received from: ${r.payer}`, `Amount: ${moneyPlain(num(r.amount))}`, `Date: ${fmtDate(r.date)}`,

/* ---------- forms ---------- */
function readForm(form, into) {
  form.querySelectorAll("[name]").forEach(el => {
    const path = el.name.split("."); let o = into;
    while (path.length > 1) { const k = path.shift(); o[k] = o[k] || {}; o = o[k]; }
    o[path[0]] = el.type === "number" ? num(el.value) : el.value.trim();
  });
  return into;
}
function syncInvoiceDraft() {
  const f = $("#invForm"); if (!f || !S.modal?.draft) return;
  const d = S.modal.draft; readForm(f, d);
  f.querySelectorAll("[data-item]").forEach(el => { d.items[+el.dataset.item][el.dataset.k] = el.dataset.k === "desc" ? el.value : num(el.value); });
}

/* ---------- actions ---------- */
async function act(a, el) {
  const m = S.modal;
  switch (a) {
    case "close": closeModal(); break;
    case "dismiss-examples": saveSettings({examplesDismissed:true}); render(); toast("Ledger cleared. Add your first record."); break;
    case "dash-month": S.dashMonth = addMonths(S.dashMonth, +el.dataset.dir); render(); break;
    case "inv-filter": S.invFilter = el.dataset.v; render(); break;
    case "exp-allmonths": S.expMonth = S.expMonth ? "" : monthKey(new Date()); render(); break;
    case "new-invoice": openModal({type:"invoiceForm", isNew:true, draft:newInvoiceDraft()}); break;
    case "edit-invoice": openModal({type:"invoiceForm", isNew:false, draft:JSON.parse(JSON.stringify(data()[m.id]))}); break;
    case "view-invoice": openModal({type:"invoiceView", id:el.dataset.id}); break;
    case "add-item": syncInvoiceDraft(); m.draft.items.push({desc:"", qty:1, price:0}); renderModal(); document.getElementById("it" + (m.draft.items.length - 1) + "d")?.focus(); break;
    case "rm-item": syncInvoiceDraft(); m.draft.items.splice(+el.dataset.i, 1); renderModal(); break;
    case "save-invoice": {
      const f = $("#invForm"); if (!f.reportValidity()) return;
      syncInvoiceDraft(); const d = m.draft;
      d.items = d.items.filter(it => it.desc || num(it.price));
      if (!d.items.length) { d.items = [{desc:"", qty:1, price:0}]; renderModal(); toast("Add at least one line item."); return; }
      if (d.status === "paid" && !d.paidDate) d.paidDate = today();
      if (d.status !== "paid") delete d.paidDate;
      put(d); toast(m.isNew ? "Invoice " + d.number + " created" : "Invoice saved");
      if (S.view !== "invoices") location.hash = "invoices"; else render();
      openModal({type:"invoiceView", id:d.id}); break;
    }
    case "mark-sent": put({...data()[m.id], status:"sent"}); toast("Marked as sent"); render(); break;
    case "pay-invoice": openModal({type:"receiptForm", isNew:true, draft:newReceiptDraft(data()[m.id])}); break;
    case "text-invoice": shareText(invoiceShareText(data()[m.id]), data()[m.id].number); break;
    case "pdf-invoice": sharePdf("invoice", data()[m.id]); break;
    case "new-receipt": openModal({type:"receiptForm", isNew:true, draft:newReceiptDraft(null)}); break;
    case "view-receipt": openModal({type:"receiptView", id:el.dataset.id}); break;
    case "edit-receipt": openModal({type:"receiptForm", isNew:false, draft:JSON.parse(JSON.stringify(data()[m.id]))}); break;
    case "save-receipt": {
      const f = $("#rctForm"); if (!f.reportValidity()) return;
      const d = readForm(f, m.draft);
      if (d.invoiceId) { const inv = data()[d.invoiceId]; if (inv && inv.status !== "paid") put({...inv, status:"paid", paidDate:d.date}); }
      put(d); toast("Receipt " + d.number + " issued"); render(); openModal({type:"receiptView", id:d.id}); break;
    }
    case "text-receipt": shareText(receiptShareText(data()[m.id]), data()[m.id].number); break;
    case "pdf-receipt": sharePdf("receipt", data()[m.id]); break;
    case "new-expense": openModal({type:"expenseForm", isNew:true, draft:newExpenseDraft()}); break;
    case "edit-expense": openModal({type:"expenseForm", isNew:false, draft:JSON.parse(JSON.stringify(data()[el.dataset.id]))}); break;
    case "save-expense": {
      const f = $("#expForm"); if (!f.reportValidity()) return;
      put(readForm(f, m.draft)); toast(m.isNew ? "Expense added" : "Expense saved"); S.modal = null; render(); break;
    }
    case "ask-delete": m.confirmDelete = true; renderModal(); break;
    case "cancel-delete": m.confirmDelete = false; renderModal(); break;
    case "do-delete": {
      const id = m.id || m.draft?.id, rec = data()[id];
      if (rec && rec.example) { m.confirmDelete = false; renderModal(); toast("Examples can't be deleted. Use “Start with an empty ledger”."); return; }
      if (rec && rec.kind === "receipt" && rec.invoiceId && S.records[rec.invoiceId]?.status === "paid") { const inv = {...S.records[rec.invoiceId], status:"sent"}; delete inv.paidDate; put(inv); }
      remove(id); S.modal = null; render(); toast("Deleted"); break;
    }
    case "remove-logo": saveSettings({logo:""}); render(); toast("Logo removed"); break;
    case "export-csv": {
      const rows = all("expense").filter(e => !S.expMonth || monthKey(e.date) === S.expMonth).sort((a, b) => a.date.localeCompare(b.date));
      if (!rows.length) { toast("No expenses to export."); return; }
      const q = v => '"' + String(v ?? "").replace(/"/g, '""') + '"';
      const csv = ["Date,Vendor,Category,Paid with,Amount (" + settings().currency + "),Note", ...rows.map(e => [e.date, q(e.vendor), q(e.category), q(e.method), num(e.amount).toFixed(2), q(e.note)].join(","))].join("\n");
      shareFile(new Blob([csv], {type:"text/csv"}), "expenses-" + (S.expMonth || "all") + ".csv", "Expenses"); break;
    }
    case "export-backup": {
      const blob = new Blob([JSON.stringify({app:"cedi-ledger", version:1, exported:new Date().toISOString(), records:S.records}, null, 1)], {type:"application/json"});
      await shareFile(blob, "cedi-ledger-backup-" + today() + ".json", "Cedi Ledger backup");
      saveSettings({lastBackup:today()}); render(); break;
    }
    case "cancel-import": S.pendingImport = null; render(); break;
    case "confirm-import": S.records = S.pendingImport.records; S.pendingImport = null; persist(); EXAMPLES = null; render(); toast("Backup restored"); break;
  }
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-action]"); if (!el) return;
  const a = el.dataset.action;
  if (a === "overlay") { if (e.target === el) closeModal(); return; }
  if (el.tagName === "LABEL") return;
  e.preventDefault(); act(a, el);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && S.modal) closeModal(); });
document.addEventListener("input", e => {
  const t = e.target;
  if (t.id === "invSearch") { S.invSearch = t.value; rerenderKeepFocus(t.id); }
  else if (t.id === "expSearch") { S.expSearch = t.value; rerenderKeepFocus(t.id); }
  else if (t.closest("#invForm")) {
    syncInvoiceDraft(); const d = S.modal.draft;
    d.items.forEach((it, i) => { const c = document.getElementById("it" + i + "t"); if (c) c.textContent = money(num(it.qty) * num(it.price)); });
    $("#invTotals").innerHTML = totalsHTML(invoiceTotals(d), d);
  }
});
document.addEventListener("change", async e => {
  const t = e.target;
  if (t.id === "dashMonth" && t.value) { S.dashMonth = t.value; render(); }
  else if (t.id === "expMonth") { S.expMonth = t.value; render(); }
  else if (t.id === "expCat") { S.expCat = t.value; render(); }
  else if (t.id === "logoInput") {
    try { const url = await readLogo(t.files[0]); saveSettings({logo:url}); render(); toast("Logo added to your invoices and receipts"); }
    catch (err) { toast(err.message); }
  } else if (t.id === "importInput") {
    const f = t.files[0]; if (!f) return;
    try {
      const j = JSON.parse(await f.text());
      if (!j || j.app !== "cedi-ledger" || typeof j.records !== "object") throw 0;
      S.pendingImport = {records:j.records, name:f.name, count:Object.values(j.records).filter(r => r.kind !== "settings").length}; render();
    } catch { toast("That file isn't a Cedi Ledger backup."); }
  }
});
function rerenderKeepFocus(id) {
  const el = document.getElementById(id), pos = el.selectionStart; render();
  const n = document.getElementById(id); n.focus(); try { n.setSelectionRange(pos, pos); } catch {}
}
document.addEventListener("submit", e => {
  e.preventDefault(); const f = e.target;
  if (f.id === "budgetForm") {
    const budgets = {}; f.querySelectorAll("input").forEach(i => { if (num(i.value) > 0) budgets[i.name] = num(i.value); });
    saveSettings({budgets}); render(); toast("Budgets saved");
  } else if (f.id === "bizForm") {
    const v = readForm(f, {});
    saveSettings({business:{name:v.name, email:v.email, phone:v.phone, address:v.address, momo:v.momo, bank:v.bank}, currency:v.currency, taxRate:num(v.taxRate),
      prefix:(v.prefix || "INV").replace(/[^A-Za-z0-9]/g, "").toUpperCase() || "INV"});
    render(); toast("Business details saved");
  } else if (f.id === "invForm") act("save-invoice");
  else if (f.id === "rctForm") act("save-receipt");
  else if (f.id === "expForm") act("save-expense");
});

/* ---------- routing & boot ---------- */
function route() { const h = location.hash.slice(1); S.view = VIEWS.some(v => v[0] === h) ? h : "dashboard"; S.modal = S.modal && S.modal.type === "invoiceView" ? S.modal : null; render(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", route);
load();
S.view = (VIEWS.find(v => v[0] === location.hash.slice(1)) || ["dashboard"])[0];
render();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => { for (const k in stampCache) delete stampCache[k]; if (S.modal) renderModal(); });
if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(() => {});
})();
</script>
</body>
</html>
